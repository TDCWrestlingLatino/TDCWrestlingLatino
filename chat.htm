<!DOCTYPE html>
<html lang="es" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TDC Wrestling Latino Chat Oficial</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        cyber: { 500: '#00ffcc', 600: '#00b388' },
                        crimson: { 500: '#ff0055', 600: '#b3003c' },
                        matrix: { 500: '#00ff00', 600: '#008800' }
                    }
                }
            }
        }
    </script>
    <!-- Google Fonts combinadas -->
    <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Bebas+Neue&family=Bungee&family=Creepster&family=Dancing+Script:wght@700&family=Eater&family=Fredoka+One&family=Inter:wght@400;700;900&family=Monoton&family=Orbitron:wght@700&family=Permanent+Marker&family=Press+Start+2P&family=Rock+Salt&family=Russo+One&family=VT323&family=Wallpoet&family=Zilla+Slab+Highlight:wght@700&display=swap" rel="stylesheet">
    <style>
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: rgba(0,0,0,0.2); }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.3); border-radius: 4px; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col font-sans transition-all duration-300" id="bodyTheme">

    <!-- MODAL DE INGRESO -->
    <div id="loginModal" class="hidden fixed inset-0 z-50 bg-black/95 backdrop-blur-md flex items-center justify-center p-4">
        <div class="bg-slate-900 border border-slate-700 w-full max-w-md rounded-2xl p-6 shadow-2xl space-y-4">
            <div class="text-center space-y-1">
                <h2 class="text-2xl font-black text-cyan-400 tracking-wider">¡Bienvenido a TDC Wrestling Latino!</h2>
                <p class="text-xs text-slate-400">Ingresa tu apodo y configura tu perfil para entrar al ring.</p>
            </div>
            
            <div class="space-y-3">
                <div>
                    <label class="block text-xs font-bold text-slate-300 mb-1">Tu Apodo / Nick *</label>
                    <input type="text" id="inputNick" placeholder="Ej. MegazordTDC..." class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-cyan-500">
                </div>

                <div>
                    <label class="block text-xs font-bold text-slate-300 mb-1">Foto de perfil (Sube archivo o pega URL):</label>
                    <input type="file" id="inputAvatarFile" accept="image/*" class="w-full text-xs text-slate-400 file:mr-3 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-semibold file:bg-cyan-600 file:text-white hover:file:bg-cyan-500 mb-2">
                    <input type="text" id="inputAvatarUrl" placeholder="O pega la URL de tu imagen aquí..." class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-cyan-500">
                </div>

                <div class="flex items-center space-x-2 pt-1">
                    <input type="checkbox" id="checkAdmin" onclick="toggleAdminCode(this)" class="w-4 h-4 rounded text-cyan-500 focus:ring-cyan-400 bg-slate-800 border-slate-700">
                    <label for="checkAdmin" class="text-xs font-semibold text-slate-300 cursor-pointer">¿Eres Administrador?</label>
                </div>

                <div id="adminCodeContainer" class="hidden">
                    <input type="password" id="inputAdminCode" placeholder="Código Secreto de Admin (tdc2026)" class="w-full bg-slate-800 border border-red-500/50 rounded-xl px-3 py-2 text-xs text-red-300 focus:outline-none focus:border-red-500">
                </div>
            </div>

            <button onclick="handleLogin()" class="w-full bg-gradient-to-r from-cyan-600 to-blue-600 hover:from-cyan-500 hover:to-blue-500 text-white font-bold py-2.5 rounded-xl text-sm shadow-lg transition-all transform active:scale-95 flex items-center justify-center space-x-2 cursor-pointer">
                <span>Entrar al Ring</span>
                <span>🚀</span>
            </button>
        </div>
    </div>

    <!-- HEADER -->
    <header id="headerTheme" class="bg-slate-900 border-b border-slate-800 px-4 py-3 flex items-center justify-between shadow-md transition-all">
        <div class="flex items-center space-x-3">
            <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-cyan-500 to-blue-600 flex items-center justify-center font-black text-white shadow-lg">TDC</div>
            <div>
                <h1 id="appTitle" class="text-base font-black tracking-wider text-white">TDC Wrestling Latino Chat Oficial</h1>
                <p id="appSubtitle" class="text-[10px] text-slate-400">Unetenos en los shows en vivo</p>
            </div>
        </div>
        <div class="flex items-center space-x-2">
            <!-- BOTÓN DE ADMIN PARA LIMPIAR CHAT -->
            <button id="btnAdminClear" onclick="clearAllMessages()" class="hidden bg-rose-600 hover:bg-rose-500 px-2.5 py-1.5 rounded-xl text-xs font-bold text-white transition-all cursor-pointer shadow flex items-center space-x-1" title="Borrar todo el chat (Solo Admin)">
                <span>🗑️</span>
                <span class="hidden sm:inline">Limpiar Chat</span>
            </button>
            <button onclick="togglePanel('skinsPanel')" class="bg-slate-800 hover:bg-slate-700 px-3 py-1.5 rounded-xl text-xs font-bold border border-slate-700 flex items-center space-x-1 transition-all cursor-pointer">
                <span>🎨</span>
                <span class="hidden sm:inline">Skins</span>
            </button>
            <button onclick="togglePanel('configPanel')" class="bg-slate-800 hover:bg-slate-700 px-3 py-1.5 rounded-xl text-xs font-bold border border-slate-700 flex items-center space-x-1 transition-all cursor-pointer">
                <span>⚙️</span>
                <span class="hidden sm:inline">Ajustes</span>
            </button>
            <button onclick="logoutUser()" class="bg-rose-950 hover:bg-rose-900 px-2.5 py-1.5 rounded-xl text-xs font-bold border border-rose-700 text-rose-200 transition-all cursor-pointer" title="Cambiar Perfil">
                <span>🚪</span>
            </button>
        </div>
    </header>

    <div class="flex-1 flex flex-col md:flex-row overflow-hidden relative">
        
        <!-- PANEL DE SKINS -->
        <div id="skinsPanel" class="hidden absolute md:relative z-20 w-full md:w-80 bg-slate-900/95 backdrop-blur-md border-r border-slate-800 p-4 space-y-4 custom-scrollbar overflow-y-auto">
            <div class="flex items-center justify-between border-b border-slate-800 pb-2">

                <button onclick="togglePanel('skinsPanel')" class="text-slate-400 hover:text-white font-bold px-2 py-0.5 rounded bg-slate-800 text-xs">✕</button>
            </div>
            <div class="space-y-2">
                <label class="text-xs font-bold text-slate-300">Selecciona tu Skin:</label>

                    <button onclick="setSkin('crimson')" class="text-left px-3 py-2 rounded-xl bg-rose-950/85 hover:bg-rose-900 border border-rose-500 text-xs font-bold text-rose-200 transition-all cursor-pointer">🐉 TDC Crimson Dragon</button>
                    <button onclick="setSkin('matrix')" class="text-left px-3 py-2 rounded-xl bg-emerald-950/85 hover:bg-emerald-900 border border-emerald-500 text-xs font-bold text-emerald-200 transition-all cursor-pointer">💻 Matrix Terminal</button>
                    <button onclick="setSkin('glass')" class="text-left px-3 py-2 rounded-xl bg-blue-950/85 hover:bg-blue-900 border border-blue-400 text-xs font-bold text-blue-200 transition-all cursor-pointer">🔮 Glassmorphism</button>
                    <button onclick="setSkin('minimal')" class="text-left px-3 py-2 rounded-xl bg-zinc-900 hover:bg-zinc-800 border border-zinc-600 text-xs font-bold text-zinc-100 transition-all cursor-pointer">🌙 Minimal Dark</button>
                </div>
            </div>
        </div>

        <!-- PANEL DE AJUSTES -->
        <div id="configPanel" class="hidden absolute md:relative z-20 w-full md:w-80 bg-slate-900/95 backdrop-blur-md border-r border-slate-800 p-4 space-y-4 custom-scrollbar overflow-y-auto">
            <div class="flex items-center justify-between border-b border-slate-800 pb-2">
                <h3 class="text-sm font-black text-cyan-400">⚙️ Ajustes Personales</h3>
                <button onclick="togglePanel('configPanel')" class="text-slate-400 hover:text-white font-bold px-2 py-0.5 rounded bg-slate-800 text-xs">✕</button>
            </div>
            <div class="space-y-3 text-xs">
                <div>
                    <label class="block font-bold text-slate-300 mb-1">Color de tu Texto:</label>
                    <input type="color" id="pickerTextColor" value="#ffffff" onchange="updateUserStyle()" class="w-full h-9 bg-slate-800 rounded-xl cursor-pointer border border-slate-700 p-1">
                </div>
                <div>
                    <label class="block font-bold text-slate-300 mb-1">Tipografía:</label>
                    <select id="selectFont" onchange="updateUserStyle()" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-2 py-2 text-white focus:outline-none focus:border-cyan-500">
                        <option value="Inter">Inter (Predeterminada)</option>
                        <option value="Orbitron">Orbitron (Futurista)</option>
                        <option value="Bebas Neue">Bebas Neue (Titular)</option>
                        <option value="Permanent Marker">Permanent Marker (Plumón)</option>
                        <option value="Impact">Impact (Pesada)</option>
                        <option value="Russo One">Russo One (Deportiva)</option>
                        <option value="Bangers">Bangers (Cómic)</option>
                        <option value="Bungee">Bungee (Bloque)</option>
                        <option value="VT323">VT323 (Retro Arcade)</option>
                        <option value="Dancing Script">Dancing Script (Cursiva)</option>
                        <option value="Fredoka One">Fredoka One (Amigable)</option>
                        <option value="Rock Salt">Rock Salt (Graffiti)</option>
                        <option value="Monoton">Monoton (Disco)</option>
                        <option value="Eater">Eater (Terror)</option>
                        <option value="Wallpoet">Wallpoet (Minimal)</option>
                        <option value="Zilla Slab Highlight">Zilla Slab Highlight</option>
                        <option value="Creepster">Creepster (Horror)</option>
                        <option value="Press Start 2P">Press Start 2P (8-Bit)</option>
                    </select>
                </div>
                <div>
                    <label class="block font-bold text-slate-300 mb-1">Tamaño de Letra:</label>
                    <select id="selectFontSize" onchange="updateUserStyle()" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-2 py-2 text-white focus:outline-none focus:border-cyan-500">
                        <option value="text-xs">Pequeño</option>
                        <option value="text-sm" selected>Normal</option>
                        <option value="text-base">Mediano</option>
                        <option value="text-lg">Grande</option>
                        <option value="text-xl">Gigante</option>
                    </select>
                </div>
            </div>
        </div>

        <!-- ÁREA PRINCIPAL DEL CHAT -->
        <div class="flex-1 flex flex-col h-[calc(100vh-65px)]" id="chatMainArea">
            
            <!-- SUBBAR -->
            <div id="subBarTheme" class="bg-slate-900/80 border-b border-slate-800 px-4 py-2 flex items-center justify-between text-xs transition-all">
                <div class="flex items-center space-x-2">
                    <span class="w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse"></span>
                    <span class="font-bold text-slate-300" id="roomTitle">Somos TDC Wrestling Latino, Unetenos!</span>
                </div>
                <div class="flex items-center space-x-3">
                    <span id="adminOnlineContainer" class="hidden text-slate-400">Activos: <strong id="onlineCount" class="text-cyan-400">0</strong></span>
                </div>
            </div>

            <!-- CONTENEDOR DE MENSAJES -->
            <div id="chatMessages" class="flex-1 p-4 overflow-y-auto flex flex-col-reverse space-y-reverse space-y-3 custom-scrollbar">
            </div>

            <!-- EMOJI BAR -->
            <div id="emojiBarTheme" class="bg-slate-900/90 border-t border-slate-800 px-3 py-2 flex items-center space-x-2 overflow-x-auto custom-scrollbar transition-all">
                <button onclick="insertEmoji('🔥')" class="text-base hover:scale-125 transition-transform cursor-pointer">🔥</button>
                <button onclick="insertEmoji('👍')" class="text-base hover:scale-125 transition-transform cursor-pointer">👍</button>
                <button onclick="insertEmoji('😂')" class="text-base hover:scale-125 transition-transform cursor-pointer">😂</button>
                <button onclick="insertEmoji('❤️')" class="text-base hover:scale-125 transition-transform cursor-pointer">❤️</button>
                <button onclick="insertEmoji('🤬')" class="text-base hover:scale-125 transition-transform cursor-pointer">🤬</button>
                <button onclick="insertEmoji('🤔')" class="text-base hover:scale-125 transition-transform cursor-pointer">🤔</button>
                <button onclick="insertEmoji('🥳')" class="text-base hover:scale-125 transition-transform cursor-pointer">🥳</button>
                <button onclick="insertEmoji('👏')" class="text-base hover:scale-125 transition-transform cursor-pointer">👏</button>
                <button onclick="insertEmoji('😎')" class="text-base hover:scale-125 transition-transform cursor-pointer">😎</button>
                <button onclick="insertEmoji('🏆')" class="text-base hover:scale-125 transition-transform cursor-pointer">🏆</button>
                <button onclick="insertEmoji('⭐')" class="text-base hover:scale-125 transition-transform cursor-pointer">⭐</button>
                <button onclick="insertEmoji('💪')" class="text-base hover:scale-125 transition-transform cursor-pointer">💪</button>
                <button onclick="insertEmoji('🚀')" class="text-base hover:scale-125 transition-transform cursor-pointer">🚀</button>
            </div>

            <!-- INPUT BAR -->
            <div id="inputBarTheme" class="bg-slate-900 border-t border-slate-800 p-3 flex items-center space-x-2 transition-all">
                <label class="bg-slate-800 hover:bg-slate-700 p-2.5 rounded-xl cursor-pointer text-cyan-400 border border-slate-700 transition-all flex items-center justify-center">
                    <span>📷</span>
                    <input type="file" id="imageInput" accept="image/*" onchange="sendImage(event)" class="hidden">
                </label>
                <input type="text" id="messageInput" onkeypress="handleKeyPress(event)" placeholder="Escribe tu mensaje o pega enlace de YouTube / GIF..." class="flex-1 bg-slate-800 border border-slate-700 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-cyan-500">
                <button onclick="sendMessage()" class="bg-cyan-600 hover:bg-cyan-500 text-white font-bold px-5 py-2.5 rounded-xl text-sm shadow-lg transition-all transform active:scale-95 cursor-pointer">Enviar</button>
            </div>
        </div>
    </div>

    <!-- MODAL DE INBOX PRIVADO (CON FOTOS Y NOTIFICACIÓN) -->
    <div id="inboxModal" class="hidden fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
        <div class="bg-slate-900 border border-slate-700 w-full max-w-lg rounded-2xl p-5 shadow-2xl flex flex-col h-[80vh]">
            <div class="flex items-center justify-between border-b border-slate-800 pb-3">
                <h3 id="inboxTitle" class="text-base font-black text-cyan-400">📬 Chat Privado</h3>
                <button onclick="closeInboxModal()" class="text-slate-400 hover:text-white font-bold px-2.5 py-1 rounded bg-slate-800 text-xs cursor-pointer">✕</button>
            </div>
            <!-- Contenedor de mensajes privados -->
            <div id="inboxContent" class="flex-1 overflow-y-auto p-3 space-y-3 custom-scrollbar flex flex-col-reverse space-y-reverse">
            </div>
            <!-- Barra de escritura privada con opción de imagen -->
            <div class="pt-3 border-t border-slate-800 flex items-center space-x-2">
                <label class="bg-slate-800 hover:bg-slate-700 p-2 rounded-xl cursor-pointer text-cyan-400 border border-slate-700 transition-all flex items-center justify-center">
                    <span>📷</span>
                    <input type="file" id="inboxImageInput" accept="image/*" onchange="sendInboxImage(event)" class="hidden">
                </label>
                <input type="text" id="inboxInput" onkeypress="handleInboxKeyPress(event)" placeholder="Escribe un mensaje privado..." class="flex-1 bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-cyan-500">
                <button onclick="sendInboxMessage()" class="bg-cyan-600 hover:bg-cyan-500 text-white font-bold px-4 py-2 rounded-xl text-xs cursor-pointer">Enviar</button>
            </div>
        </div>
    </div>

    <!-- FIREBASE & LÓGICA TOTALMENTE CORREGIDA -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getDatabase, ref, push, onValue, remove, set, onDisconnect, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBfHf7to54O5jnozK26dJG6an74n2R5tHY",
            authDomain: "tdcchat-e9e0d.firebaseapp.com",
            databaseURL: "https://tdcchat-e9e0d-default-rtdb.firebaseio.com",
            projectId: "tdcchat-e9e0d",
            storageBucket: "tdcchat-e9e0d.firebasestorage.app",
            messagingSenderId: "655487245154",
            appId: "1:655487245154:web:99d3905627002ad37faa3b",
            measurementId: "G-EM27QM3BLG"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        let currentUser = {
            nick: '',
            avatar: '',
            isAdmin: false,
            textColor: '#ffffff',
            font: 'Inter',
            fontSize: 'text-sm'
        };

        let messages = [];
        let currentTargetUser = null;
        let inboxUnsubscribe = null;
        let activePrivateRooms = {}; // Para vigilar notificaciones entrantes de otros usuarios

        window.addEventListener('DOMContentLoaded', () => {
            const savedUser = localStorage.getItem('tdc_chat_user');
            if (savedUser) {
                try {
                    currentUser = JSON.parse(savedUser);
                    document.getElementById('loginModal').classList.add('hidden');
                    document.getElementById('pickerTextColor').value = currentUser.textColor || '#ffffff';
                    document.getElementById('selectFont').value = currentUser.font || 'Inter';
                    document.getElementById('selectFontSize').value = currentUser.fontSize || 'text-sm';
                    
                    checkAdminUIs();
                    initFirebaseListeners();
                } catch(e) {
                    localStorage.removeItem('tdc_chat_user');
                    document.getElementById('loginModal').classList.remove('hidden');
                }
            } else {
                document.getElementById('loginModal').classList.remove('hidden');
            }
        });

        function checkAdminUIs() {
            if(currentUser.isAdmin) {
                document.getElementById('btnAdminClear').classList.remove('hidden');
                document.getElementById('adminOnlineContainer').classList.remove('hidden');
            } else {
                document.getElementById('btnAdminClear').classList.add('hidden');
                document.getElementById('adminOnlineContainer').classList.add('hidden');
            }
        }

        window.toggleAdminCode = function(checkbox) {
            const container = document.getElementById('adminCodeContainer');
            if (checkbox.checked) {
                container.classList.remove('hidden');
            } else {
                container.classList.add('hidden');
                document.getElementById('inputAdminCode').value = '';
            }
        }

        window.handleLogin = function() {
            const nickInput = document.getElementById('inputNick').value.trim();
            const urlInput = document.getElementById('inputAvatarUrl').value.trim();
            const fileInput = document.getElementById('inputAvatarFile').files[0];
            const wantsAdmin = document.getElementById('checkAdmin').checked;
            const adminCode = document.getElementById('inputAdminCode').value.trim();

            if(!nickInput) {
                alert('Por favor ingresa un apodo (nick) válido.');
                return;
            }

            currentUser.nick = nickInput;
            currentUser.textColor = '#00ffcc';
            currentUser.font = 'Inter';
            currentUser.fontSize = 'text-sm';

            if(wantsAdmin) {
                if(adminCode === 'tdc2026') {
                    currentUser.isAdmin = true;
                } else {
                    alert('Código de administrador incorrecto. Ingresarás como usuario estándar.');
                    currentUser.isAdmin = false;
                }
            } else {
                currentUser.isAdmin = false;
            }

            currentUser.avatar = `https://ui-avatars.com/api/?name=${encodeURIComponent(nickInput)}&background=00ffcc&color=000&bold=true`;

            if(urlInput) {
                currentUser.avatar = urlInput;
                finalizeLogin();
            } else if(fileInput) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    currentUser.avatar = e.target.result;
                    finalizeLogin();
                };
                reader.onerror = function() { finalizeLogin(); };
                reader.readAsDataURL(fileInput);
            } else {
                finalizeLogin();
            }
        }

        function finalizeLogin() {
            localStorage.setItem('tdc_chat_user', JSON.stringify(currentUser));
            document.getElementById('loginModal').classList.add('hidden');
            checkAdminUIs();
            initFirebaseListeners();
        }

        window.logoutUser = function() {
            if(confirm('¿Deseas cerrar sesión y cambiar tu apodo/foto de perfil?')) {
                localStorage.removeItem('tdc_chat_user');
                location.reload();
            }
        }

        function initFirebaseListeners() {
            // 1. Chat General
            const messagesRef = ref(db, 'chat_messages');
            onValue(messagesRef, (snapshot) => {
                const data = snapshot.val();
                messages = [];
                if (data) {
                    Object.keys(data).forEach(key => {
                        messages.push({ firebaseKey: key, ...data[key] });
                    });
                    messages.sort((a, b) => b.id - a.id);
                }
                renderMessages();
            });

            // 2. Presencia Online (Corregido para asegurar conteo exacto de activos)
            const myPresenceRef = push(ref(db, 'online_users'));
            set(myPresenceRef, { nick: currentUser.nick, time: serverTimestamp() });
            onDisconnect(myPresenceRef).remove();

            const onlineUsersRef = ref(db, 'online_users');
            onValue(onlineUsersRef, (snapshot) => {
                const data = snapshot.val();
                const activeCount = data ? Object.keys(data).length : 1;
                const counterElement = document.getElementById('onlineCount');
                if (counterElement) {
                    counterElement.textContent = activeCount;
                }
            });

            // 3. Vigilante global de mensajes privados (Notificaciones emergentes)
            const privateChatsRef = ref(db, 'private_chats');
            onValue(privateChatsRef, (snapshot) => {
                const allRooms = snapshot.val();
                if (!allRooms) return;

                Object.keys(allRooms).forEach(roomKey => {
                    // Si la sala privada incluye mi nick actual
                    if (roomKey.includes(currentUser.nick)) {
                        const roomMessages = allRooms[roomKey];
                        if (!roomMessages) return;

                        // Obtener el último mensaje enviado
                        const msgKeys = Object.keys(roomMessages);
                        const lastMsgKey = msgKeys[msgKeys.length - 1];
                        const lastMsg = roomMessages[lastMsgKey];

                        // Si el mensaje no es mío y es nuevo, lanzamos alerta de notificación
                        if (lastMsg && lastMsg.sender !== currentUser.nick) {
                            // Evitar disparar alerta repetida por el mismo mensaje guardado
                            const notifId = roomKey + "_" + lastMsg.id;
                            if (!window.notifiedMessages) window.notifiedMessages = {};
                            
                            if (!window.notifiedMessages[notifId]) {
                                window.notifiedMessages[notifId] = true;
                                // Si no tenemos el chat abierto con
