<!-- MODAL DE INGRESO -->
    <div id="loginModal" class="hidden fixed inset-0 z-50 bg-black/95 backdrop-blur-md flex overflow-y-auto p-3" style="position: fixed; inset: 0; z-index: 50; background: rgba(0,0,0,0.95); display: flex; align-items: center; justify-content: center;">
        <div class="m-auto bg-slate-900 border border-slate-700 w-full max-w-md rounded-2xl p-4 sm:p-6 shadow-2xl space-y-4" style="background-color: #0f172a; border: 1px solid #334155; width: 100%; max-width: 400px; border-radius: 1rem; padding: 24px; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25); color: #f8fafc; font-family: 'Inter', sans-serif;">
            <div class="text-center space-y-1" style="text-align: center; margin-bottom: 16px;">
                <h2 class="text-xl font-black text-cyan-400 tracking-wider" style="font-size: 1.25rem; font-weight: 900; color: #22d3ee; margin-bottom: 4px;">¡Bienvenido a TDC Wrestling Latino!</h2>
                <p class="text-xs text-slate-400" style="font-size: 0.75rem; color: #94a3b8;">Ingresa tu apodo y configura tu perfil para entrar al ring.</p>
            </div>
            
            <div class="space-y-3" style="display: flex; flex-direction: column; gap: 12px;">
                <div>
                    <label class="block text-xs font-bold text-slate-300 mb-1" style="display: block; font-size: 0.75rem; font-weight: bold; color: #cbd5e1; margin-bottom: 4px;">Tu Apodo / Nick *</label>
                    <input type="text" id="inputNick" placeholder="Ej. MegazordTDC..." class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-cyan-500" style="width: 100%; background-color: #1e293b; border: 1px solid #334155; border-radius: 0.75rem; padding: 8px 12px; font-size: 0.875rem; color: #fff; box-sizing: border-box;">
                </div>

                <div>
                    <label class="block text-xs font-bold text-slate-300 mb-1" style="display: block; font-size: 0.75rem; font-weight: bold; color: #cbd5e1; margin-bottom: 4px;">Foto de perfil (Sube archivo o pega URL):</label>
                    <input type="file" id="inputAvatarFile" accept="image/*" class="w-full text-xs text-slate-400 file:mr-3 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-semibold file:bg-cyan-600 file:text-white hover:file:bg-cyan-500 mb-2" style="width: 100%; font-size: 0.75rem; color: #94a3b8; margin-bottom: 8px;">
                    <input type="text" id="inputAvatarUrl" placeholder="O pega la URL de tu imagen aquí..." class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-cyan-500" style="width: 100%; background-color: #1e293b; border: 1px solid #334155; border-radius: 0.75rem; padding: 8px 12px; font-size: 0.75rem; color: #fff; box-sizing: border-box;">
                </div>

                <div class="flex items-center space-x-2 pt-1" style="display: flex; align-items: center; gap: 8px; padding-top: 4px;">
                    <input type="checkbox" id="checkAdmin" onclick="toggleAdminCode(this)" class="w-4 h-4 rounded text-cyan-500 focus:ring-cyan-400 bg-slate-800 border-slate-700" style="width: 1rem; height: 1rem;">
                    <label for="checkAdmin" class="text-xs font-semibold text-slate-300 cursor-pointer" style="font-size: 0.75rem; font-weight: 600; color: #cbd5e1; cursor: pointer;">¿Eres Administrador?</label>
                </div>

                <div id="adminCodeContainer" class="hidden" style="display: none;">
                    <input type="password" id="inputAdminCode" placeholder="Código Secreto de Admin" class="w-full bg-slate-800 border border-red-500/50 rounded-xl px-3 py-2 text-xs text-red-300 focus:outline-none focus:border-red-500" style="width: 100%; background-color: #1e293b; border: 1px solid rgba(239, 68, 68, 0.5); border-radius: 0.75rem; padding: 8px 12px; font-size: 0.75rem; color: #fca5a5; box-sizing: border-box;">
                </div>
            </div>

            <button onclick="handleLogin()" class="w-full bg-gradient-to-r from-cyan-600 to-blue-600 hover:from-cyan-500 hover:to-blue-500 text-white font-bold py-2.5 rounded-xl text-sm shadow-lg transition-all transform active:scale-95 flex items-center justify-center space-x-2 cursor-pointer" style="width: 100%; margin-top: 16px; background: linear-gradient(to right, #0891b2, #2563eb); color: #fff; font-weight: bold; padding: 10px; border-radius: 0.75rem; border: none; font-size: 0.875rem; cursor: pointer; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.3);">
                <span>Entrar al Ring</span>
                <span>🚀</span>
            </button>
        </div>
    </div>
