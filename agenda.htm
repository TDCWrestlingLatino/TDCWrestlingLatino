<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cartelera Oficial - TDC</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            background-color: #0b0f19;
            color: #ffffff;
            font-family: 'Oswald', 'Arial Narrow', sans-serif;
            overflow-y: auto;
            padding: 5px;
        }

        .tabla-metalica {
            width: 100%;
            background: linear-gradient(180deg, #1e293b 0%, #0f172a 100%);
            border: 2px solid #475569;
            box-shadow: 0 8px 24px rgba(0,0,0,0.7);
        }

        .fecha-cabecera {
            background: linear-gradient(90deg, #1e3a8a 0%, #2563eb 50%, #1e3a8a 100%);
            border-bottom: 3px solid #38bdf8;
            color: #ffffff;
            text-align: center;
            padding: 8px 0;
            font-size: 1.1rem;
            font-weight: 500;
            letter-spacing: 2px;
            text-transform: uppercase;
            text-shadow: 0 0 6px rgba(56, 189, 248, 0.6);
        }

        .columnas-etiquetas {
            display: grid;
            grid-template-columns: 80px 1fr 100px;
            padding: 6px 10px;
            font-size: 0.8rem;
            color: #94a3b8;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        .text-center { text-align: center; }

        .lista-shows {
            display: flex;
            flex-direction: column;
            gap: 5px;
            padding: 8px;
        }

        .fila-show {
            display: grid;
            grid-template-columns: 80px 1fr 100px;
            align-items: center;
            background: linear-gradient(90deg, #1e293b 0%, #111827 100%);
            border: 1px solid #334155;
            transition: all 0.2s ease;
        }
        .fila-show:hover {
            border-color: #38bdf8;
            box-shadow: 0 0 10px rgba(56, 189, 248, 0.2);
            background: linear-gradient(90deg, #334155 0%, #1e293b 100%);
        }

        .celda-hora {
            background: linear-gradient(135deg, #1e40af 0%, #0f172a 100%);
            color: #38bdf8;
            font-size: 0.95rem;
            font-weight: 500;
            text-align: center;
            padding: 10px 0;
            border-right: 1px solid #334155;
            clip-path: polygon(0 0, 100% 0, 85% 100%, 0% 100%);
            letter-spacing: 1px;
        }

        .celda-contenido {
            display: flex;
            align-items: center;
            padding-left: 10px;
            gap: 12px;
        }

        .l {
            height: 24px;
            width: 40px;
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            flex-shrink: 0;
        }

        .logo-aew { background-image: url('https://2img.net/i.imgur.com/XWTv5yO.png'); }
        .logo-roh { background-image: url('https://2img.net/i.imgur.com/9hVv9Wn.png'); }
        .logo-raw { background-image: url('https://2img.net/i.imgur.com/mVpXNF9.png'); }
        .logo-smackdown { background-image: url('https://2img.net/i.imgur.com/oijCtZh.png'); }

        .show-titulo {
            font-size: 0.85rem;
            font-weight: 400;
            color: #e2e8f0;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .celda-estado {
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 5px;
            clip-path: polygon(15% 0, 100% 0, 100% 100%, 0% 100%);
            background: rgba(0, 0, 0, 0.3);
        }

        .badge {
            width: 100%;
            padding: 4px 0;
            text-align: center;
            font-size: 0.75rem;
            font-weight: 600;
            border-radius: 2px;
            text-transform: uppercase;
           
        }

       .badge-vivo {
    background: #e11d48;
    color: #ffffff;
    padding: 3px 8px;
    border-radius: 4px;
    font-weight: bold;
    font-size: 0.75rem;
    box-shadow: 0 0 8px rgba(225, 29, 72, 0.6);
    cursor: pointer !important;
}
.badge-repetir {
    background: #334155;
    color: #94a3b8;
    padding: 3px 8px;
    border-radius: 4px;
    font-size: 0.75rem;
    cursor: pointer !important;
}
      * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
       
       html, body {
            width: 100%;
            height: 100%;
            overflow-x: hidden; /* QUITA EL SCROLL HORIZONTAL */
            overflow-y: auto;   /* PERMITE SCROLL VERTICAL */
            background-color: #0b0f19;
            color: #ffffff;
        }

          .btn-agenda {
    transform: skewX(-15deg); /* Le da la inclinación deportiva */
    background: #2563eb;
    color: white;
    border: none;
    padding: 6px 14px;
    font-weight: bold;
    cursor: pointer;
}
.btn-agenda span {
    transform: skewX(15deg); /* Endereza el texto interno para que no se deforme */
    display: inline-block;
}
    </style>
</head>
<body>

    <div class="tabla-metalica">
        <div class="fecha-cabecera">CARTELERA OFICIAL DE LA SEMANA</div>

<!-- FILA DE EJEMPLO 1: RAW EN VIVO -> MANDA AL CANAL 1 (h3-senal-1) -->
<tr>
    <td class="hora">8:00 PM</td>
    <td class="evento">
        <img src="logo-raw.png" alt="RAW"> WWE RAW ESPAÑOL - SHOW EN VIVO
    </td>
    <td>
        <button class="badge-vivo" onclick="parent.cargarCanal('https://transmision.activo.mx/h3-senal-1', parent.document.querySelectorAll('.btn-canal')[1])">
            CANAL 1
        </button>
    </td>
</tr>

<!-- FILA DE EJEMPLO 2: SMACKDOWN EN VIVO -> MANDA AL CANAL 2 (h4-senal-2) -->
<tr>
    <td class="hora">8:00 PM</td>
    <td class="evento">
        <img src="logo-smackdown.png" alt="SD"> WWE SMACKDOWN - COBERTURA LATINA
    </td>
    <td>
        <button class="badge-vivo" onclick="parent.cargarCanal('https://transmision.activo.mx/h4-senal-2', parent.document.querySelectorAll('.btn-canal')[2])">
            CANAL 2
        </button>
    </td>
</tr>

<!-- FILA DE EJEMPLO 3: REPETICIÓN -> MANDA AL CANAL 3 O A LA SEÑAL QUE DÉ LA REPETICIÓN -->
<tr>
    <td class="hora">24/7</td>
    <td class="evento">
        <img src="logo-aaa.png" alt="AAA"> LUCHA LIBRE AAA - REPETICIÓN ESPECIAL
    </td>
    <td>
        <button class="badge-repetir" onclick="parent.cargarCanal('https://transmision.activo.mx/h5-senal-3', parent.document.querySelectorAll('.btn-canal')[3])">
            VER REPETICIÓN
        </button>
    </td>
</tr>

</body>
</html>
