<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cartelera Oficial - TDC</title>
    
    <!-- ENLACE DE FUENTE CORREGIDO -->
    <link href="https://googleapis.com" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #0b0f19;
            color: #ffffff;
            font-family: 'Oswald', 'Arial Narrow', sans-serif;
            padding: 10px;
            width: 100%;
            max-width: 660px;
            height: 464px;
            overflow-y: auto;
        }

        .tabla-metalica {
            width: 100%;
            background: linear-gradient(180deg, #1e293b 0%, #0f172a 100%);
            border: 2px solid #475569;
            box-shadow: 0 8px 24px rgba(0,0,0,0.7);
        }

        .fecha-cabecera {
            background: linear-gradient(90deg, #1e3a8a 0%, #2563eb 50%, #1e3a8a 100%);
            border-bottom: 3px solid #38bdf8;
            color: #ffffff;
            text-align: center;
            padding: 8px 0;
            font-size: 1.15rem;
            font-weight: 500; 
            letter-spacing: 2px;
            text-transform: uppercase;
            text-shadow: 0 0 6px rgba(56, 189, 248, 0.6);
        }

        .columnas-etiquetas {
            display: grid;
            grid-template-columns: 85px 1fr 100px;
            padding: 6px 10px;
            font-size: 0.8rem;
            color: #94a3b8;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        .text-center { text-align: center; }

        .lista-shows {
            display: flex;
            flex-direction: column;
            gap: 5px;
            padding: 8px;
        }

        .fila-show {
            display: grid;
            grid-template-columns: 85px 1fr 100px;
            align-items: center;
            background: linear-gradient(90deg, #1e293b 0%, #111827 100%);
            border: 1px solid #334155;
            transition: all 0.2s ease;
        }
        .fila-show:hover {
            border-color: #38bdf8;
            box-shadow: 0 0 10px rgba(56, 189, 248, 0.2);
            background: linear-gradient(90deg, #334155 0%, #1e293b 100%);
        }

        .celda-hora {
            background: linear-gradient(135deg, #1e40af 0%, #0f172a 100%);
            color: #38bdf8;
            font-size: 1rem;
            font-weight: 500;
            text-align: center;
            padding: 10px 0;
            border-right: 1px solid #334155;
            clip-path: polygon(0 0, 100% 0, 85% 100%, 0% 100%);
            letter-spacing: 1px;
        }
        .fila-show:hover .celda-hora {
            color: #ffffff;
            background: linear-gradient(135deg, #2563eb 0%, #1e40af 100%);
        }

        .celda-contenido {
            display: flex;
            align-items: center;
            padding-left: 10px;
            gap: 15px;
        }

      /* TU CLASE MADRE CORREGIDA (Con el interruptor de renderizado físico) */
.l {
    display: inline-block; /* <-- ESTE ES EL INTERRUPTOR MÁGICO: Obliga al navegador a pintar el cuadro en la pantalla */
    height: 28px;
    width: 50px;
    background-size: contain;
    background-repeat: no-repeat;
    background-position: center;
    vertical-align: middle; /* Alinea el logo perfectamente al centro del texto del show */
    filter: drop-shadow(0 0 4px rgba(255,255,255,0.3)); /* Le da un ligero brillo premium de fondo */
}

        
        /* Tus carpetas de enlaces directos configuradas en minúsculas */
        .aew { background-image: url('https://2img.net'); }
        .aaa { background-image: url('https://2img.net'); }
        .raw { background-image: url('https://2img.net'); }
        .smackdown { background-image: url('https://2img.net'); }
        .roh { background-image: url('https://2img.net'); }

        .show-titulo {
            font-size: 0.9rem;
            font-weight: 400; 
            color: #e2e8f0;
            letter-spacing: 1.2px;
            text-transform: uppercase;
        }
        .fila-show:hover .show-titulo {
            color: #38bdf8;
        }

        .celda-estado {
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 5px;
            clip-path: polygon(15% 0, 100% 0, 100% 100%, 0% 100%);
            background: rgba(0, 0, 0, 0.3);
        }

        .badge {
            width: 100%;
            padding: 5px 0;
            text-align: center;
            font-size: 0.8rem;
            font-weight: 600;
            border-radius: 2px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .badge-vivo {
            background: #ffffff;
            color: #1e40af;
            box-shadow: 0 0 8px rgba(255, 255, 255, 0.6);
            border: 1px solid #38bdf8;
        }

        .badge-repeticion {
            background: linear-gradient(180deg, #475569 0%, #1e293b 100%);
            color: #94a3b8;
            border: 1px solid #334155;
        }
    </style>
</head>
<body>

    <div class="tabla-metalica">
        <div class="fecha-cabecera">CARTELERA OFICIAL DE LA SEMANA</div>

        <div class="columnas-etiquetas">
            <div class="text-center">HORA</div>
            <div>EVENTO EN TRANSMISIÓN</div>
            <div class="text-center">ESTADO</div>
        </div>

        <div class="lista-shows">
            <!-- LLAMADO DE CLASES CORREGIDO SIN EL PUNTO INTERNO -->
            <div class="fila-show">
                <div class="celda-hora">8:00 PM</div>
                <div class="celda-contenido">
                    <span class="l raw"></span>
                    <div class="show-titulo">WWE RAW ESPAÑOL - SHOW EN VIVO</div>
                </div>
                <div class="celda-estado">
                    <span class="badge badge-vivo">EN VIVO</span>
                </div>
            </div>

            <div class="fila-show">
                <div class="celda-hora">8:00 PM</div>
                <div class="celda-contenido">
                    <span class="l smackdown"></span>
                    <div class="show-titulo">WWE SMACKDOWN - COBERTURA LATINA</div>
                </div>
                <div class="celda-estado">
                    <span class="badge badge-vivo">EN VIVO</span>
                </div>
            </div>

            <div class="fila-show">
                <div class="celda-hora">24/7</div>
                <div class="celda-contenido">
                    <span class="l aaa"></span>
                    <div class="show-titulo">LUCHA LIBRE AAA - REPETICIÓN ESPECIAL</div>
                </div>
                <div class="celda-estado">
                    <span class="badge badge-repeticion">REPETICIÓN</span>
                </div>
            </div>

            <div class="fila-show">
                <div class="celda-hora">24/7</div>
                <div class="celda-contenido">
                    <span class="l roh"></span>
                    <div class="show-titulo">RING OF HONOR - EVENTO COMPLETO</div>
                </div>
                <div class="celda-estado">
                    <span class="badge badge-repeticion">REPETICIÓN</span>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
