<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cartelera Oficial - TDC</title>
    
    <!-- FUENTES DE ACCIÓN E INFORMALES DIRECTAS -->
    <link href="https://googleapis.com" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #0b0f19;
            color: #ffffff;
            /* Forzamos tipografías de impacto e informales en toda la cartelera */
            font-family: 'Teko', 'Oswald', 'Impact', sans-serif;
            padding: 10px;
            width: 660px;  /* TU ANCHO EXACTO */
            height: 464px; /* TU ALTURA EXACTA */
            overflow-y: auto;
        }

        /* Contenedor principal estilo acero */
        .tabla-metalica {
            width: 100%;
            background: linear-gradient(180deg, #1e293b 0%, #0f172a 100%);
            border: 2px solid #475569;
            box-shadow: 0 8px 24px rgba(0,0,0,0.7);
        }

        /* BARRA SUPERIOR CON LETRA INFORMAL DE ACCIÓN */
        .fecha-cabecera {
            background: linear-gradient(90deg, #1e3a8a 0%, #2563eb 50%, #1e3a8a 100%);
            border-bottom: 3px solid #38bdf8;
            color: #ffffff;
            text-align: center;
            padding: 6px 0;
            font-family: 'Teko', 'Impact', sans-serif;
            font-size: 1.6rem; /* Letra más alta, imponente e informal */
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            text-shadow: 0 0 8px rgba(56, 189, 248, 0.8);
        }

        /* TITULOS DE COLUMNAS */
        .columnas-etiquetas {
            display: grid;
            grid-template-columns: 85px 1fr 100px;
            padding: 6px 10px;
            font-family: 'Oswald', sans-serif;
            font-size: 0.85rem;
            color: #94a3b8;
            letter-spacing: 1px;
            text-transform: uppercase;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        .text-center { text-align: center; }

        .lista-shows {
            display: flex;
            flex-direction: column;
            gap: 5px;
            padding: 8px;
        }

        .fila-show {
            display: grid;
            grid-template-columns: 85px 1fr 100px;
            align-items: center;
            background: linear-gradient(90deg, #1e293b 0%, #111827 100%);
            border: 1px solid #334155;
            transition: all 0.2s ease;
        }
        .fila-show:hover {
            border-color: #38bdf8;
            box-shadow: 0 0 10px rgba(56, 189, 248, 0.3);
            background: linear-gradient(90deg, #334155 0%, #1e293b 100%);
        }

        .celda-hora {
            background: linear-gradient(135deg, #1e40af 0%, #0f172a 100%);
            color: #38bdf8;
            font-family: 'Teko', sans-serif;
            font-size: 1.3rem;
            font-weight: 700;
            text-align: center;
            padding: 8px 0;
            border-right: 1px solid #334155;
            clip-path: polygon(0 0, 100% 0, 85% 100%, 0% 100%);
        }
        .fila-show:hover .celda-hora {
            color: #ffffff;
            background: linear-gradient(135deg, #2563eb 0%, #1e40af 100%);
        }

        .celda-contenido {
            display: flex;
            align-items: center;
            padding-left: 10px;
            gap: 15px;
        }

        .logo-empresa {
            height: 28px;
            width: 50px;
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            display: inline-block;
            filter: drop-shadow(0 0 4px rgba(255,255,255,0.3));
        }

        /* Diccionario de logos */
        .logo-empresa.aaa { background-image: url('https://2img.net'); }
        .logo-empresa.wwe { background-image: url('https://2img.net'); }
        .logo-empresa.raw { background-image: url('https://2img.net'); }
        .logo-empresa.smackdown { background-image: url('https://2img.net'); }
        .logo-empresa.njpw { background-image: url('https://2img.net'); }
        .logo-empresa.roh { background-image: url('https://2img.net'); }

        /* TITULO DEL SHOW TRANSFORMA AL LOOK INFORMAL DE LUCHA */
        .show-titulo {
            font-family: 'Oswald', 'Impact', sans-serif; /* Eliminamos Arial por completo */
            font-weight: 700;
            font-size: 1rem;
            color: #ffffff;
            letter-spacing: 0.5px;
            text-transform: uppercase; /* Forzamos mayúsculas deportivas */
        }
        .fila-show:hover .show-titulo {
            color: #38bdf8; /* El texto brilla en celeste al pasar el cursor */
        }

        .celda-estado {
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 5px;
            clip-path: polygon(15% 0, 100% 0, 100% 100%, 0% 100%);
            background: rgba(0, 0, 0, 0.3);
        }

        .badge {
            width: 100%;
            padding: 4px 0;
            text-align: center;
            font-family: 'Teko', sans-serif;
            font-size: 1.1rem;
            font-weight: 700;
            border-radius: 2px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .badge-vivo {
            background: #ffffff;
            color: #1e40af;
            box-shadow: 0 0 8px rgba(255, 255, 255, 0.6);
            border: 1px solid #38bdf8;
        }

        .badge-repeticion {
            background: linear-gradient(180deg, #475569 0%, #1e293b 100%);
            color: #94a3b8;
            border: 1px solid #334155;
        }
    </style>
</head>
<body>

    <div class="tabla-metalica">
        <!-- CABECERA PRINCIPAL CON NUEVA FUENTE INFORMAL -->
        <div class="fecha-cabecera">CARTELERA OFICIAL DE LA SEMANA</div>

        <div class="columnas-etiquetas">
            <div class="text-center">HORA</div>
            <div>EVENTO EN TRANSMISIÓN</div>
            <div class="text-center">ESTADO</div>
        </div>

        <div class="lista-shows">

            <!-- SHOW 1 -->
            <div class="fila-show">
                <div class="celda-hora">8:00 PM</div>
                <div class="celda-contenido">
                    <span class="logo-empresa raw"></span>
                    <div class="show-titulo">WWE RAW ESPAÑOL - SHOW EN VIVO</div>
                </div>
                <div class="celda-estado">
                    <span class="badge badge-vivo">EN VIVO</span>
                </div>
            </div>

            <!-- SHOW 2 -->
            <div class="fila-show">
                <div class="celda-hora">8:00 PM</div>
                <div class="celda-contenido">
                    <span class="logo-empresa smackdown"></span>
                    <div class="show-titulo">WWE SMACKDOWN - COBERTURA LATINA</div>
                </div>
                <div class="celda-estado">
                    <span class="badge badge-vivo">EN VIVO</span>
                </div>
            </div>

            <!-- SHOW 3 -->
            <div class="fila-show">
                <div class="celda-hora">24/7</div>
                <div class="celda-contenido">
                    <span class="logo-empresa aaa"></span>
                    <div class="show-titulo">LUCHA LIBRE AAA - REPETICIÓN ESPECIAL</div>
                </div>
                <div class="celda-estado">
                    <span class="badge badge-repeticion">REPETICIÓN</span>
                </div>
            </div>

            <!-- SHOW 4 -->
            <div class="fila-show">
                <div class="celda-hora">24/7</div>
                <div class="celda-contenido">
                    <span class="logo-empresa roh"></span>
                    <div class="show-titulo">RING OF HONOR - EVENTO COMPLETO</div>
                </div>
                <div class="celda-estado">
                    <span class="badge badge-repeticion">REPETICIÓN</span>
                </div>
            </div>

        </div>
    </div>

</body>
</html>
