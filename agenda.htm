<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cartelera Oficial - TDC</title>
    
    <!-- FUENTE OSWALD -->
    <link href="https://googleapis.com" rel="stylesheet" type="text/css" />

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #0b0f19;
            color: #ffffff;
            font-family: 'Oswald', Arial, sans-serif;
            padding: 10px;
            width: 660px;  /* TU ANCHO EXACTO */
            height: 464px; /* TU ALTURA EXACTA */
            overflow-y: auto;
        }

        /* Contenedor principal estilo acero */
        .tabla-metalica {
            width: 100%;
            background: linear-gradient(180deg, #1e293b 0%, #0f172a 100%);
            border: 2px solid #475569;
            box-shadow: 0 8px 24px rgba(0,0,0,0.7);
        }

        .fecha-cabecera {
            background: linear-gradient(90deg, #334155 0%, #475569 50%, #334155 100%);
            border-bottom: 3px solid #2563eb;
            color: #ffffff;
            text-align: center;
            padding: 8px 0;
            font-size: 1.2rem;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            text-shadow: 0 0 5px rgba(37, 99, 235, 0.6);
        }

        .columnas-etiquetas {
            display: grid;
            grid-template-columns: 85px 1fr 100px;
            padding: 6px 10px;
            font-size: 0.8rem;
            color: #94a3b8;
            letter-spacing: 1px;
            text-transform: uppercase;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        .text-center { text-align: center; }

        .lista-shows {
            display: flex;
            flex-direction: column;
            gap: 5px;
            padding: 8px;
        }

        .fila-show {
            display: grid;
            grid-template-columns: 85px 1fr 100px;
            align-items: center;
            background: linear-gradient(90deg, #1e293b 0%, #111827 100%);
            border: 1px solid #334155;
            transition: all 0.2s ease;
        }
        .fila-show:hover {
            border-color: #38bdf8;
            box-shadow: 0 0 10px rgba(56, 189, 248, 0.2);
            background: linear-gradient(90deg, #334155 0%, #1e293b 100%);
        }

        .celda-hora {
            background: linear-gradient(135deg, #1e40af 0%, #0f172a 100%);
            color: #38bdf8;
            font-size: 1rem;
            font-weight: 700;
            text-align: center;
            padding: 12px 0;
            border-right: 1px solid #334155;
            clip-path: polygon(0 0, 100% 0, 85% 100%, 0% 100%);
        }
        .fila-show:hover .celda-hora {
            color: #ffffff;
            background: linear-gradient(135deg, #2563eb 0%, #1e40af 100%);
        }

        .celda-contenido {
            display: flex;
            align-items: center;
            padding-left: 10px;
            gap: 15px;
        }

        /* CLASE MAESTRA DE ÍCONOS INTELIGENTES */
        .logo-empresa {
            height: 28px;
            width: 50px;
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            display: inline-block;
            filter: drop-shadow(0 0 4px rgba(255,255,255,0.3));
        }

        /* DICCIONARIO DE IMÁGENES REALES (Tus links de Foroactivo cargados de forma nativa) */
        .logo-empresa.aaa { background-image: url('https://2img.net'); }
        .logo-empresa.wwe { background-image: url('https://2img.net'); }
        .logo-empresa.raw { background-image: url('https://2img.net'); }
        .logo-empresa.smackdown { background-image: url('https://2img.net'); }
        .logo-empresa.njpw { background-image: url('https://2img.net'); }
        .logo-empresa.roh { background-image: url('https://2img.net'); }

        .show-titulo {
            font-family: Arial, sans-serif;
            font-weight: bold;
            font-size: 0.9rem;
            color: #e2e8f0;
            letter-spacing: 0.5px;
        }

        .celda-estado {
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 5px;
            clip-path: polygon(15% 0, 100% 0, 100% 100%, 0% 100%);
            background: rgba(0, 0, 0, 0.3);
        }

        .badge {
            width: 100%;
            padding: 5px 0;
            text-align: center;
            font-size: 0.75rem;
            font-weight: 700;
            border-radius: 2px;
            text-transform: uppercase;
        }

        .badge-vivo {
            background: #ffffff;
            color: #1e40af;
            box-shadow: 0 0 8px rgba(255, 255, 255, 0.6);
            border: 1px solid #38bdf8;
        }

        .badge-repeticion {
            background: linear-gradient(180deg, #475569 0%, #1e293b 100%);
            color: #94a3b8;
            border: 1px solid #334155;
        }
    </style>
</head>
<body>

    <div class="tabla-metalica">
        <div class="fecha-cabecera">CARTELERA OFICIAL DE LA SEMANA</div>

        <div class="columnas-etiquetas">
            <div class="text-center">HORA</div>
            <div>EVENTO EN TRANSMISIÓN</div>
            <div class="text-center">ESTADO</div>
        </div>

        <div class="lista-shows">

            <!-- EJEMPLO 1: MUESTRA EL LOGO DE RAW DE FORMA AUTOMÁTICA -->
            <div class="fila-show">
                <div class="celda-hora">8:00 PM</div>
                <div class="celda-contenido">
                    <span class="logo-empresa raw"></span>
                    <div class="show-titulo">WWE RAW ESPAÑOL - SHOW EN VIVO</div>
                </div>
                <div class="celda-estado">
                    <span class="badge badge-vivo">EN VIVO</span>
                </div>
            </div>

            <!-- EJEMPLO 2: MUESTRA EL LOGO DE SMACKDOWN -->
            <div class="fila-show">
                <div class="celda-hora">8:00 PM</div>
                <div class="celda-contenido">
                    <span class="logo-empresa smackdown"></span>
                    <div class="show-titulo">WWE SMACKDOWN - COBERTURA LATINA</div>
                </div>
                <div class="celda-estado">
                    <span class="badge badge-vivo">EN VIVO</span>
                </div>
            </div>

            <!-- EJEMPLO 3: MUESTRA EL LOGO DE AAA -->
            <div class="fila-show">
                <div class="celda-hora">24/7</div>
                <div class="celda-contenido">
                    <span class="logo-empresa aaa"></span>
                    <div class="show-titulo">LUCHA LIBRE AAA - REPETICIÓN ESPECIAL</div>
                </div>
                <div class="celda-estado">
                    <span class="badge badge-repeticion">REPETICIÓN</span>
                </div>
            </div>

            <!-- EJEMPLO 4: MUESTRA EL LOGO DE ROH -->
            <div class="fila-show">
                <div class="celda-hora">24/7</div>
                <div class="celda-contenido">
                    <span class="logo-empresa roh"></span>
                    <div class="show-titulo">RING OF HONOR - EVENTO COMPLETO</div>
                </div>
                <div class="celda-estado">
                    <span class="badge badge-repeticion">REPETICIÓN</span>
                </div>
            </div>

        </div>
    </div>

</body>
</html>
