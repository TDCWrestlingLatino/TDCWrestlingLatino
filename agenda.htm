<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cartelera Oficial - TDC</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            background-color: #0b0f19;
            color: #ffffff;
            font-family: 'Oswald', 'Arial Narrow', sans-serif;
            overflow-y: auto;
            padding: 5px;
        }

        .tabla-metalica {
            width: 100%;
            background: linear-gradient(180deg, #1e293b 0%, #0f172a 100%);
            border: 2px solid #475569;
            box-shadow: 0 8px 24px rgba(0,0,0,0.7);
        }

        .fecha-cabecera {
            background: linear-gradient(90deg, #1e3a8a 0%, #2563eb 50%, #1e3a8a 100%);
            border-bottom: 3px solid #38bdf8;
            color: #ffffff;
            text-align: center;
            padding: 8px 0;
            font-size: 1.1rem;
            font-weight: 500;
            letter-spacing: 2px;
            text-transform: uppercase;
            text-shadow: 0 0 6px rgba(56, 189, 248, 0.6);
        }

        .columnas-etiquetas {
            display: grid;
            grid-template-columns: 80px 1fr 100px;
            padding: 6px 10px;
            font-size: 0.8rem;
            color: #94a3b8;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        .text-center { text-align: center; }

        .lista-shows {
            display: flex;
            flex-direction: column;
            gap: 5px;
            padding: 8px;
        }

        .fila-show {
            display: grid;
            grid-template-columns: 80px 1fr 100px;
            align-items: center;
            background: linear-gradient(90deg, #1e293b 0%, #111827 100%);
            border: 1px solid #334155;
            transition: all 0.2s ease;
        }
        .fila-show:hover {
            border-color: #38bdf8;
            box-shadow: 0 0 10px rgba(56, 189, 248, 0.2);
            background: linear-gradient(90deg, #334155 0%, #1e293b 100%);
        }

        .celda-hora {
            background: linear-gradient(135deg, #1e40af 0%, #0f172a 100%);
            color: #38bdf8;
            font-size: 0.95rem;
            font-weight: 500;
            text-align: center;
            padding: 10px 0;
            border-right: 1px solid #334155;
            clip-path: polygon(0 0, 100% 0, 85% 100%, 0% 100%);
            letter-spacing: 1px;
        }

        .celda-contenido {
            display: flex;
            align-items: center;
            padding-left: 10px;
            gap: 12px;
        }

        .l {
            height: 24px;
            width: 40px;
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            flex-shrink: 0;
        }

        .logo-aew { background-image: url('https://2img.net/i.imgur.com/XWTv5yO.png'); }
        .logo-roh { background-image: url('https://2img.net/i.imgur.com/9hVv9Wn.png'); }
        .logo-raw { background-image: url('https://2img.net/i.imgur.com/mVpXNF9.png'); }
        .logo-smackdown { background-image: url('https://2img.net/i.imgur.com/oijCtZh.png'); }

        .show-titulo {
            font-size: 0.85rem;
            font-weight: 400;
            color: #e2e8f0;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .celda-estado {
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 5px;
            clip-path: polygon(15% 0, 100% 0, 100% 100%, 0% 100%);
            background: rgba(0, 0, 0, 0.3);
        }

        .badge {
            width: 100%;
            padding: 4px 0;
            text-align: center;
            font-size: 0.75rem;
            font-weight: 600;
            border-radius: 2px;
            text-transform: uppercase;
        }

        .badge-vivo {
            background: #ffffff;
            color: #1e40af;
            border: 1px solid #38bdf8;
        }

        .badge-repeticion {
            background: linear-gradient(180deg, #475569 0%, #1e293b 100%);
            color: #94a3b8;
            border: 1px solid #334155;
        }
    </style>
</head>
<body>

    <div class="tabla-metalica">
        <div class="fecha-cabecera">CARTELERA OFICIAL DE LA SEMANA</div>

        <div class="columnas-etiquetas">
            <div class="text-center">HORA</div>
            <div>EVENTO EN TRANSMISIÓN</div>
            <div class="text-center">ESTADO</div>
        </div>

        <div class="lista-shows">
            <div class="fila-show">
                <div class="celda-hora">8:00 PM</div>
                <div class="celda-contenido">
                    <span class="l logo-raw"></span>
                    <div class="show-titulo">WWE RAW ESPAÑOL - SHOW EN VIVO</div>
                </div>
                <div class="celda-estado">
                    <span class="badge badge-vivo">EN VIVO</span>
                </div>
            </div>

            <div class="fila-show">
                <div class="celda-hora">8:00 PM</div>
                <div class="celda-contenido">
                    <span class="l logo-smackdown"></span>
                    <div class="show-titulo">WWE SMACKDOWN - COBERTURA LATINA</div>
                </div>
                <div class="celda-estado">
                    <span class="badge badge-vivo">EN VIVO</span>
                </div>
            </div>

            <div class="fila-show">
                <div class="celda-hora">24/7</div>
                <div class="celda-contenido">
                    <span class="l logo-aew"></span>
                    <div class="show-titulo">LUCHA LIBRE AAA - REPETICIÓN ESPECIAL</div>
                </div>
                <div class="celda-estado">
                    <span class="badge badge-repeticion">REPETICIÓN</span>
                </div>
            </div>

            <div class="fila-show">
                <div class="celda-hora">24/7</div>
                <div class="celda-contenido">
                    <span class="l logo-roh"></span>
                    <div class="show-titulo">RING OF HONOR - EVENTO COMPLETO</div>
                </div>
                <div class="celda-estado">
                    <span class="badge badge-repeticion">REPETICIÓN</span>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
