<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Plataforma Premium - TDC Wrestling</title>
    <style>
        /* RESET AMBIENTAL */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Impact', 'Arial Black', sans-serif;
        }

        body {
            background: transparent; /* Permite que luzca el fondo de tu estadio en Blogger */
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding-top: 5px;
        }

        /* CONTENEDOR TOTAL FIJADO A TUS 970PX DE ANCHO */
        .plataforma-tnt {
            width: 970px;
            background: linear-gradient(180deg, #2d3748 0%, #1a202c 100%);
            border: 3px solid #4a5568;
            border-radius: 8px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.9);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* BARRA SUPERIOR DE CANALES */
        .barra-canales {
            width: 100%;
            background: rgba(15, 23, 42, 0.95);
            border-bottom: 3px solid #2563eb;
            padding: 6px 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .fila-botones {
            display: flex;
            gap: 4px;
        }

        .btn-canal {
            background: #1e293b;
            color: #94a3b8;
            border: 1px solid #334155;
            padding: 5px 10px;
            font-size: 0.75rem;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-canal:hover, .btn-canal.activo {
            background: linear-gradient(180deg, #2563eb 0%, #1e40af 100%);
            color: #ffffff;
            border-color: #38bdf8;
            box-shadow: inset 0 0 6px #38bdf8;
        }

        .btn-doble {
            background: linear-gradient(180deg, #718096 0%, #4a5568 100%);
            color: white;
            border: 2px solid #cbd5e1;
            padding: 4px 10px;
            cursor: pointer;
            font-size: 0.75rem;
            text-transform: uppercase;
            border-radius: 3px;
        }
        .btn-doble:hover {
            background: linear-gradient(180deg, #dc2626 0%, #991b1b 100%);
            border-color: #f87171;
            box-shadow: 0 0 10px rgba(220, 38, 38, 0.6);
        }

        /* AREA INFERIOR DE TRABAJO MATEMÁTICO */
        .workspace {
            display: grid;
            grid-template-columns: 310px 660px; /* TUS MEDIDAS EXACTAS */
            width: 100%;
            height: 464px; /* TU ALTURA EXACTA */
            background: #111827;
        }

        /* MARCOS INDIVIDUALES */
        .panel-bloque {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        #panel-chat {
            border-right: 2px solid #4a5568;
            background: #0b0f19;
        }

        .zona-contenido {
            width: 100%;
            height: 100%;
            position: relative;
            background: #0f172a;
        }

        /* LA AGENDA PREMIUM METÁLICA */
        .vista-agenda {
            width: 100%;
            height: 100%;
            padding: 10px;
            overflow-y: auto;
        }

        .cabecera-agenda {
            display: grid;
            grid-template-columns: 80px 1fr 110px;
            background: #1e293b;
            border: 1px solid #4a5568;
            padding: 6px 0;
            text-align: center;
            font-size: 0.75rem;
            color: #94a3b8;
            margin-bottom: 6px;
        }

        .grid-eventos {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .fila-evento {
            display: grid;
            grid-template-columns: 80px 1fr 110px;
            align-items: center;
            background: #1a202c;
            border: 1px solid #2d3748;
            cursor: pointer;
            transition: all 0.2s;
        }
        .fila-evento:hover {
            background: #2d3748;
            border-color: #3b82f6;
            box-shadow: 0 0 10px rgba(59, 130, 246, 0.2);
        }

        .ev-hora {
            background: linear-gradient(135deg, #7f1d1d 0%, #450a0a 100%);
            color: white;
            font-size: 0.95rem;
            text-align: center;
            padding: 10px 0;
            clip-path: polygon(0 0, 100% 0, 85% 100%, 0% 100%);
        }

        .ev-detalles {
            display: flex;
            align-items: center;
            padding-left: 10px;
            gap: 10px;
        }

        .ev-logo {
            height: 25px;
            width: 45px;
            object-fit: contain;
        }

        .ev-titulo {
            font-family: 'Arial', sans-serif;
            font-weight: bold;
            font-size: 0.85rem;
            color: #e2e8f0;
        }

        .ev-estado {
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            clip-path: polygon(15% 0, 100% 0, 100% 100%, 0% 100%);
        }

        .badge {
            width: 100%;
            padding: 6px 0;
            text-align: center;
            font-size: 0.75rem;
        }
        .badge-vivo {
            background: linear-gradient(90deg, #dc2626 0%, #991b1b 100%);
            color: white;
            box-shadow: 0 0 8px #dc2626;
        }

        /* COMPONENTE DE REPRODUCTORES (INICIA OCULTO) */
        .zona-videos {
            display: none;
            width: 100%;
            height: 100%;
            grid-template-columns: 1fr;
        }

        .iframe-player {
            width: 100%;
            height: 100%;
            border: none;
            background: #000;
        }

        #player-2 { display: none; }

        /* ========================================================
           AJUSTE MATEMÁTICO DEL MODO DOBLE PANTALLA
           ======================================================== */
        body.modo-doble-activo .workspace {
            grid-template-columns: 1fr; /* Borra los 310px del chat */
        }
        body.modo-doble-activo #panel-chat { display: none; }
        body.modo-doble-activo .zona-videos {
            display: grid;
            grid-template-columns: 1fr 1fr; /* Divide los 970px en dos pantallas de 485px cada una */
            gap: 4px;
            padding: 4px;
            background: #0b0f19;
        }
        body.modo-doble-activo #player-2 { display: block; }
    </style>
</head>

            </div>

        </main>
    </div>
