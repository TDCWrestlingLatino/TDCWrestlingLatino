<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plataforma Premium - TDC Wrestling</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Oswald', 'Arial Narrow', sans-serif; 
        }

        body {
            background: #0b0f19;
            overflow-x: hidden;
            overflow-y: auto;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding-top: 5px;
        }

        .plataforma-tnt {
            width: 970px;
            background: linear-gradient(180deg, #2d3748 0%, #1a202c 100%);
            border: 3px solid #4a5568;
            border-radius: 8px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.9);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* BARRA SUPERIOR DE CANALES */
        .barra-canales {
            width: 100%;
            background: rgba(15, 23, 42, 0.95);
            border-bottom: 3px solid #2563eb;
            padding: 8px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .grid-botones-canales {
            display: grid;
            grid-template-columns: repeat(10, 1fr);
            gap: 4px;
            width: 100%;
        }

        .btn-canal {
            background: linear-gradient(180deg, #1e293b 0%, #0f172a 100%);
            color: #ffffff;
            border: 1px solid #334155;
            padding: 4px 0;
            font-size: 0.9rem;
            cursor: pointer;
            text-align: center;
            transition: all 0.15s ease-in-out;
        }
        .btn-canal:hover, .btn-canal.activo {
            background: linear-gradient(180deg, #2563eb 0%, #1e40af 100%);
            color: #38bdf8;
            border-color: #38bdf8;
        }

        .btn-doble {
            width: 100%;
            background: linear-gradient(90deg, #1e3a8a 0%, #2563eb 50%, #1e3a8a 100%);
            color: white;
            border: 1px solid #3b82f6;
            padding: 5px 0;
            cursor: pointer;
            font-weight: 500; 
            font-size: 0.85rem;
            text-transform: uppercase;
        }
        .btn-doble:hover {
            background: linear-gradient(90deg, #991b1b 0%, #dc2626 50%, #991b1b 100%);
            border-color: #f87171;
            box-shadow: 0 0 12px rgba(239, 68, 68, 0.4);
        }

        .btn-repetir-nav {
            width: 100%;
            background: linear-gradient(90deg, #059669 0%, #10b981 50%, #059669 100%);
            color: white;
            border: 1px solid #34d399;
            padding: 5px 0;
            cursor: pointer;
            font-weight: 500; 
            font-size: 0.85rem;
            text-transform: uppercase;
            transition: all 0.2s ease;
        }
        .btn-repetir-nav:hover {
            background: linear-gradient(90deg, #047857 0%, #059669 50%, #047857 100%);
            box-shadow: 0 0 12px rgba(16, 185, 129, 0.4);
        }

        /* BARRA DE REDES Y LOGO CENTRAL */
        .barra-redes-brand {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(15, 23, 42, 0.98);
            border-top: 1px solid #334155;
            padding: 6px 12px;
            gap: 10px;
        }

        .brand-logo {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .logo-img {
            height: 22px;
            width: auto;
            object-fit: contain;
        }
        .logo-texto {
            font-size: 1rem;
            font-weight: 700;
            color: #38bdf8;
            letter-spacing: 1.5px;
            text-shadow: 0 0 8px rgba(56, 189, 248, 0.5);
        }

        .redes-grupo {
            display: flex;
            gap: 6px;
        }

        .btn-red {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 3px 10px;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: 600;
            color: #ffffff;
            text-decoration: none;
            transition: all 0.2s ease;
        }
        .btn-red.fb { background: #1877f2; }
        .btn-red.tg { background: #229ed9; }
        .btn-red.wa { background: #25d366; color: #000; }
        .btn-red.kick { background: #53fc18; color: #000; }

        .btn-red:hover {
            transform: translateY(-1px);
            filter: brightness(1.15);
        }

        /* BARRA DE CONTROL DE PANTALLA SELECCIONADA */
        .control-pantallas {
            display: none;
            background: #0f172a;
            padding: 4px;
            border-bottom: 1px solid #334155;
            justify-content: center;
            gap: 10px;
        }
        body.modo-doble-activo .control-pantallas {
            display: flex;
        }
        .btn-target {
            background: #1e293b;
            color: #94a3b8;
            border: 1px solid #475569;
            padding: 2px 12px;
            font-size: 0.8rem;
            cursor: pointer;
            border-radius: 3px;
        }
        .btn-target.seleccionado {
            background: #2563eb;
            color: #ffffff;
            border-color: #38bdf8;
            font-weight: 600;
        }

        /* WORKSPACE Y PANTALLAS */
        .workspace {
            display: flex;
            width: 100%;
            height: 464px;
            background: #111827;
        }

        #panel-chat {
            width: 310px;
            height: 100%;
            border-right: 2px solid #4a5568;
            background: #0b0f19;
            flex-shrink: 0;
        }

        .zona-contenido {
            flex-grow: 1;
            height: 100%;
            background: #000000;
            display: flex;
        }

        .iframe-player {
            width: 100%;
            height: 100%;
            border: 0;
            background: #000000;
        }

        /* SEGUNDA PANTALLA */
        #reproductor2 {
            display: none;
            width: 50%;
            border-left: 2px solid #2563eb;
        }

        /* CUANDO EL MODO MUTANTE ESTÁ ACTIVO */
        body.modo-doble-activo #panel-chat {
            display: none !important;
        }
        body.modo-doble-activo #reproductor1 {
            width: 50%;
        }
        body.modo-doble-activo #reproductor2 {
            display: block;
        }

        /* OPTIMIZACIÓN MÓVIL BASE 660PX / CHAT 310PX */
        @media (max-width: 980px) and (orientation: portrait) {
            body { 
                padding: 5px 0;
                display: flex;
                justify-content: center;
            }

            .plataforma-tnt { 
                width: 100%; 
                max-width: 660px; 
                border: 2px solid #4a5568; 
                border-radius: 6px; 
                margin: 0 auto;
            }

            .grid-botones-canales { 
                grid-template-columns: repeat(5, 1fr); 
            }

            .barra-redes-brand {
                flex-direction: column;
                gap: 8px;
            }
            .brand-logo {
                order: -1;
            }

            .workspace { 
                flex-direction: column; 
                height: auto; 
                align-items: center; 
            }

            .zona-contenido { 
                width: 100%; 
                max-width: 660px;
                flex-direction: column; 
                height: auto; 
            }

            .iframe-player { 
                width: 100% !important;
                height: 371px; 
                max-height: 56.25vw;
            }

            #panel-chat { 
                width: 310px !important; 
                height: 380px; 
                border-right: none; 
                border-top: 2px solid #4a5568; 
                margin: 10px auto 5px auto; 
                border-radius: 4px;
                overflow: hidden;
                flex-shrink: 0;
            }
        }

        @media (max-width: 980px) and (orientation: landscape) {
            body { 
                padding: 2px; 
            }

            .plataforma-tnt { 
                width: 100%; 
                max-width: 970px; 
            }

            .workspace { 
                flex-direction: row !important; 
                height: 85vh; 
            }

            #panel-chat { 
                width: 310px !important; 
                height: 100%; 
                border-right: 2px solid #4a5568; 
                border-top: none; 
                margin: 0;
            }

            .zona-contenido { 
                flex-grow: 1; 
                height: 100%; 
            }

            .iframe-player { 
                height: 100% !important; 
            }
        }
    </style>
<script>
    let pantallaObjetivo = 'reproductor1';

    function seleccionarPantalla(idTarget, btn) {
        pantallaObjetivo = idTarget;
        document.querySelectorAll('.btn-target').forEach(b => b.classList.remove('seleccionado'));
        btn.classList.add('seleccionado');
    }

    function cargarCanal(url, elemento) {
        // Carga la URL de la agenda o canal en el iframe seleccionado
        document.getElementById(pantallaObjetivo).src = url;

        // Quita la clase 'activo' de todos los botones de canales y repeticiones
        let botones = document.querySelectorAll('.btn-canal, .btn-repetir-nav');
        botones.forEach(btn => btn.classList.remove('activo'));

        // Si se hizo clic desde un botón superior, lo resalta
        if (elemento) {
            elemento.classList.add('activo');
        }
    }

    function alternarDoblePantalla() {
        document.body.classList.toggle('modo-doble-activo');

        let rep2 = document.getElementById('reproductor2');

        if (document.body.classList.contains('modo-doble-activo')) {
            if (rep2.src === "" || rep2.src.includes('about:blank')) {
                rep2.src = 'agenda.htm';
            }
        } else {
            pantallaObjetivo = 'reproductor1';

            let btnIzq = document.querySelector('.btn-target');
            if (btnIzq) {
                document.querySelectorAll('.btn-target').forEach(b => b.classList.remove('seleccionado'));
                btnIzq.classList.add('seleccionado');
            }
        }
    }
</script>
