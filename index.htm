<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plataforma Premium - TDC Wrestling</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Oswald', 'Arial Narrow', sans-serif; 
        }

        body, html {
            width: 100% !important;
            height: 100% !important;
            margin: 0;
            padding: 0;
            background-color: #0b0f19;
            overflow-x: hidden;
        }

        .plataforma-tnt {
    width: 100% !important;
    height: 100% !important;
    display: flex;
    flex-direction: column;
}

        /* BARRA SUPERIOR DE CANALES FLUIDA */
        .barra-canales {
            width: 100%;
            background: rgba(15, 23, 42, 0.95);
            border-bottom: 3px solid #2563eb;
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .grid-botones-canales {
            display: grid;
            grid-template-columns: repeat(10, 1fr);
            gap: 6px;
            width: 100%;
        }

        .btn-canal {
            background: linear-gradient(180deg, #1e293b 0%, #0f172a 100%);
            color: #e2e8f0;
            border: 1px solid #334155;
            padding: 10px 0;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            text-align: center;
            border-radius: 3px;
            transition: all 0.15s ease-in-out;
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.05);
        }
        .btn-canal:hover {
            background: linear-gradient(180deg, #2563eb 0%, #1e40af 100%);
            color: #ffffff;
            border-color: #60a5fa;
            box-shadow: 0 0 10px rgba(37, 99, 235, 0.6);
            transform: translateY(-1px);
        }
        .btn-canal.activo {
            background: linear-gradient(180deg, #2563eb 0%, #1d4ed8 100%) !important;
            color: #ffffff !important;
            border-color: #38bdf8 !important;
            box-shadow: 0 0 12px rgba(56, 189, 248, 0.8);
            font-weight: 700;
        }

        .btn-doble {
            width: 100%;
            background: linear-gradient(90deg, #1e3a8a 0%, #2563eb 50%, #1e3a8a 100%);
            color: white;
            border: 1px solid #3b82f6;
            padding: 10px 0;
            cursor: pointer;
            font-weight: 600; 
            font-size: 0.95rem;
            text-transform: uppercase;
            border-radius: 3px;
        }
        .btn-doble:hover {
            background: linear-gradient(90deg, #991b1b 0%, #dc2626 50%, #991b1b 100%);
            border-color: #f87171;
            box-shadow: 0 0 12px rgba(239, 68, 68, 0.4);
        }

        .btn-repetir-nav {
            width: 100%;
            background: linear-gradient(90deg, #059669 0%, #10b981 50%, #059669 100%);
            color: white;
            border: 1px solid #34d399;
            padding: 10px 0;
            cursor: pointer;
            font-weight: 600; 
            font-size: 0.95rem;
            text-transform: uppercase;
            border-radius: 3px;
            transition: all 0.2s ease;
        }
        .btn-repetir-nav:hover {
            background: linear-gradient(90deg, #047857 0%, #059669 50%, #047857 100%);
            box-shadow: 0 0 12px rgba(16, 185, 129, 0.4);
        }

        /* BARRA DE REDES SOCIALES */
        .barra-redes-brand {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(15, 23, 42, 0.98);
            border-top: 1px solid #334155;
            padding: 8px 15px;
            gap: 10px;
        }

        .brand-logo {
            font-size: 1.1rem;
            font-weight: 700;
            color: #38bdf8;
            letter-spacing: 2px;
            text-shadow: 0 0 8px rgba(56, 189, 248, 0.5);
            text-transform: uppercase;
        }

        .redes-grupo {
            display: flex;
            gap: 8px;
        }

        .btn-red {
            display: inline-block;
            padding: 5px 12px;
            border-radius: 4px;
            font-size: 0.8rem;
            font-weight: 700;
            color: #ffffff;
            text-decoration: none;
            text-transform: uppercase;
            transition: all 0.2s ease;
        }
        .btn-red.fb { background: #1877f2; }
        .btn-red.tg { background: #229ed9; }
        .btn-red.wa { background: #25d366; color: #000; }
        .btn-red.kick { background: #53fc18; color: #000; }

        .btn-red:hover {
            transform: translateY(-1px);
            filter: brightness(1.15);
        }

        /* WORKSPACE Y PANTALLAS (OCUPAN TODO EL ESPACIO RESTANTE) */
      .workspace {
    display: flex;
    width: 100%;
    flex-grow: 1;
}

        #panel-chat {
            width: 320px;
            height: 100%;
            border-right: 2px solid #4a5568;
            background: #0b0f19;
            flex-shrink: 0;
        }

.zona-contenido {
    flex-grow: 1;
    height: 100%;
    display: flex;
}

        .iframe-player {
            width: 100%;
            height: 100%;
            border: 0;
            background: #000000;
        }

        /* SEGUNDA PANTALLA */
        #reproductor2 {
            display: none;
            width: 50%;
            border-left: 2px solid #2563eb;
        }

        /* MODO DOBLE PANTALLA ACTIVO */
        body.modo-doble-activo #panel-chat {
            display: none !important;
        }
        body.modo-doble-activo #reproductor1 {
            width: 50%;
        }
        body.modo-doble-activo #reproductor2 {
            display: block;
            width: 50%;
        }

@media (max-width: 768px) {
    body, html {
        overflow-x: hidden !important;
    }
    .plataforma-tnt {
        width: 100% !important;
        min-width: 100% !important;
    }
    .workspace {
        flex-direction: column !important;
        height: auto !important;
    }
    #panel-chat {
        width: 100% !important;
        height: 350px !important;
    }
    .zona-contenido {
        width: 100% !important;
        height: 450px !important;
    }
    .grid-botones-canales {
        grid-template-columns: repeat(5, 1fr) !important;
    }
}



        
    </style>

    <script>
        var pantallaObjetivo = 'reproductor1';

        function seleccionarPantalla(idTarget, btn) {
            pantallaObjetivo = idTarget;
            var targets = document.querySelectorAll('.btn-target');
            for (var i = 0; i < targets.length; i++) {
                targets[i].classList.remove('seleccionado');
            }
            btn.classList.add('seleccionado');
        }

        function cargarCanal(url, elemento) {
            var targetIframe = document.getElementById(pantallaObjetivo);
            if (targetIframe) {
                targetIframe.src = url;
            }

            var botones = document.querySelectorAll('.btn-canal, .btn-repetir-nav');
            for (var i = 0; i < botones.length; i++) {
                botones[i].classList.remove('activo');
            }

            if (elemento) {
                elemento.classList.add('activo');
            }
        }

        function alternarDoblePantalla() {
            document.body.classList.toggle('modo-doble-activo');
            var rep2 = document.getElementById('reproductor2');

            if (document.body.classList.contains('modo-doble-activo')) {
                if (rep2.src === "" || rep2.src.indexOf('about:blank') !== -1) {
                    rep2.src = 'agenda.htm';
                }
            } else {
                pantallaObjetivo = 'reproductor1';
            }
        }
    </script>
