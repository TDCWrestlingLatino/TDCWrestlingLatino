<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plataforma Premium - TDC Wrestling</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Oswald', 'Arial Narrow', sans-serif; 
        }

        body {
            background: #0b0f19;
            overflow-x: hidden;
            overflow-y: auto;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding-top: 5px;
        }

        .plataforma-tnt {
            width: 970px;
            background: linear-gradient(180deg, #2d3748 0%, #1a202c 100%);
            border: 3px solid #4a5568;
            border-radius: 8px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.9);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .barra-canales {
            width: 100%;
            background: rgba(15, 23, 42, 0.95);
            border-bottom: 3px solid #2563eb;
            padding: 8px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .grid-botones-canales {
            display: grid;
            grid-template-columns: repeat(10, 1fr);
            gap: 4px;
            width: 100%;
        }

        .btn-canal {
            background: linear-gradient(180deg, #1e293b 0%, #0f172a 100%);
            color: #ffffff;
            border: 1px solid #334155;
            padding: 4px 0;
            font-size: 0.95rem;
            cursor: pointer;
            text-align: center;
            transition: all 0.15s ease-in-out;
        }
        .btn-canal:hover, .btn-canal.activo {
            background: linear-gradient(180deg, #2563eb 0%, #1e40af 100%);
            color: #38bdf8;
            border-color: #38bdf8;
        }

        .btn-doble {
            width: 100%;
            background: linear-gradient(90deg, #1e3a8a 0%, #2563eb 50%, #1e3a8a 100%);
            color: white;
            border: 1px solid #3b82f6;
            padding: 5px 0;
            cursor: pointer;
            font-weight: 500; 
            font-size: 0.85rem;
            text-transform: uppercase;
        }

        .workspace {
            display: grid;
            grid-template-columns: 310px 660px;
            width: 100%;
            height: 464px;
            background: #111827;
            transition: grid-template-columns 0.3s ease;
        }

        #panel-chat {
            border-right: 2px solid #4a5568;
            background: #0b0f19;
            height: 100%;
        }

        .zona-contenido {
            width: 100%;
            height: 100%;
            background: #000000;
        }

        .iframe-player {
            width: 100%;
            height: 100%;
            border: 0;
            background: #000000;
        }

        body.modo-doble-activo .workspace {
            grid-template-columns: 0px 1fr;
        }
        body.modo-doble-activo #panel-chat {
            display: none;
        }
    </style>

    <script>
        function cargarCanal(url, elemento) {
            document.getElementById('reproductor').src = url;
            let botones = document.querySelectorAll('.btn-canal');
            botones.forEach(btn => btn.classList.remove('activo'));
            elemento.classList.add('activo');
        }

        function alternarDoblePantalla() {
            document.body.classList.toggle('modo-doble-activo');
        }
    </script>
</head>
<body>

    <div class="plataforma-tnt">
        <nav class="barra-canales">
            <div class="grid-botones-canales">
                <button class="btn-canal activo" style="color: #38bdf8;" onclick="cargarCanal('agenda.htm', this)">AGENDA</button>                               
                <button class="btn-canal" onclick="cargarCanal('https://activo.mx', this)">C1</button>                               
                <button class="btn-canal" onclick="cargarCanal('https://activo.mx', this)">C2</button>                               
                <button class="btn-canal" onclick="cargarCanal('https://activo.mx', this)">C3</button>                               
                <button class="btn-canal" onclick="cargarCanal('https://activo.mx', this)">C4</button>                               
                <button class="btn-canal" onclick="cargarCanal('https://activo.mx', this)">C5</button>                               
                <button class="btn-canal" onclick="cargarCanal('https://activo.mx', this)">C6</button>                               
                <button class="btn-canal" onclick="cargarCanal('https://activo.mx', this)">C7</button>                               
                <button class="btn-canal" onclick="cargarCanal('https://activo.mx', this)">C8</button>                               
                <button class="btn-canal" onclick="cargarCanal('https://activo.mx', this)">C9</button>
            </div>

            <div class="grid-botones-canales" style="grid-template-columns: 1fr 9fr;">
                <button class="btn-canal" onclick="cargarCanal('https://activo.mx', this)">C10</button>
                <button class="btn-doble" onclick="alternarDoblePantalla()">🖥️ ACTIVAR INTERFAZ MUTANTE DOBLE PANTALLA AL 100%</button>
            </div>
        </nav>

        <main class="workspace">
            <!-- PANEL CHAT IZQUIERDO -->
            <div id="panel-chat">
                <iframe id="reproductor" src="https://transmision.activo.mx/h22-chatango sandbox=" class="iframe-player" allowfullscreen></iframe>
            </div>

            <!-- ZONA DE REPRODUCCIÓN / AGENDA (DERECHA) -->
            <div class="zona-contenido">
                <iframe id="reproductor" src="agenda.htm" class="iframe-player" allowfullscreen></iframe>
            </div>
        </main>
    </div>

</body>
</html>
