<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Plataforma Premium - TDC Wrestling</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: 'Oswald', 'Arial Narrow', sans-serif;
}
html, body {
  background-color: transparent;
  margin: 0;
  padding: 0;
  width: 100%;
}

/* WRAPPER QUE ESCALA EN MÓVIL */
.escaler-wrapper {
  width: 100%;
  max-width: 970px;
  margin: 0 auto;
  transform-origin: top center;
}

.plataforma-tnt {
  width: 100%;
  background: linear-gradient(180deg, #2d3748 0%, #1a202c 100%);
  border: 3px solid #4a5568;
  border-radius: 8px;
  box-shadow: 0 15px 35px rgba(0, 0, 0, 0.9);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

/* BARRA SUPERIOR DE CANALES */
.barra-canales {
  width: 100%;
  background: rgba(15, 23, 42, 0.95);
  border-bottom: 3px solid #2563eb;
  padding: 8px;
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.grid-botones-canales {
  display: grid;
  grid-template-columns: repeat(10, 1fr);
  gap: 4px;
  width: 100%;
}
.btn-canal {
  background: linear-gradient(180deg, #1e293b 0%, #0f172a 100%);
  color: #e2e8f0;
  border: 1px solid #334155;
  padding: 6px 0;
  font-size: 0.85rem;
  font-weight: 600;
  cursor: pointer;
  text-align: center;
  border-radius: 3px;
  transition: all 0.15s ease-in-out;
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.05);
}
.btn-canal:hover {
  background: linear-gradient(180deg, #2563eb 0%, #1e40af 100%);
  color: #ffffff;
  border-color: #60a5fa;
  box-shadow: 0 0 10px rgba(37, 99, 235, 0.6);
  transform: translateY(-1px);
}
.btn-canal.activo {
  background: linear-gradient(180deg, #2563eb 0%, #1d4ed8 100%) !important;
  color: #ffffff !important;
  border-color: #38bdf8 !important;
  box-shadow: 0 0 12px rgba(56, 189, 248, 0.8);
  font-weight: 700;
}
.btn-doble {
  width: 100%;
  background: linear-gradient(90deg, #1e3a8a 0%, #2563eb 50%, #1e3a8a 100%);
  color: white;
  border: 1px solid #3b82f6;
  padding: 6px 0;
  cursor: pointer;
  font-weight: 600;
  font-size: 0.85rem;
  text-transform: uppercase;
  border-radius: 3px;
}
.btn-doble:hover {
  background: linear-gradient(90deg, #991b1b 0%, #dc2626 50%, #991b1b 100%);
  border-color: #f87171;
  box-shadow: 0 0 12px rgba(239, 68, 68, 0.4);
}
.btn-repetir-nav {
  width: 100%;
  background: linear-gradient(90deg, #059669 0%, #10b981 50%, #059669 100%);
  color: white;
  border: 1px solid #34d399;
  padding: 6px 0;
  cursor: pointer;
  font-weight: 600;
  font-size: 0.85rem;
  text-transform: uppercase;
  border-radius: 3px;
  transition: all 0.2s ease;
}
.btn-repetir-nav:hover {
  background: linear-gradient(90deg, #047857 0%, #059669 50%, #047857 100%);
  box-shadow: 0 0 12px rgba(16, 185, 129, 0.4);
}

/* BARRA DE REDES SOCIALES */
.barra-redes-brand {
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: rgba(15, 23, 42, 0.98);
  border-top: 1px solid #334155;
  padding: 6px 12px;
  gap: 10px;
}
.brand-logo {
  font-size: 1rem;
  font-weight: 700;
  color: #38bdf8;
  letter-spacing: 1.5px;
  text-shadow: 0 0 8px rgba(56, 189, 248, 0.5);
  text-transform: uppercase;
}
.redes-grupo {
  display: flex;
  gap: 6px;
}
.btn-red {
  display: inline-block;
  padding: 4px 10px;
  border-radius: 4px;
  font-size: 0.75rem;
  font-weight: 700;
  color: #ffffff;
  text-decoration: none;
  text-transform: uppercase;
  transition: all 0.2s ease;
}
.btn-red.fb { background: #1877f2; }
.btn-red.tg { background: #229ed9; }
.btn-red.wa { background: #25d366; color: #000; }
.btn-red.kick { background: #53fc18; color: #000; }
.btn-red:hover {
  transform: translateY(-1px);
  filter: brightness(1.15);
}

/* CONTROL DE PANTALLAS */
.control-pantallas {
  display: none;
  background: #0f172a;
  padding: 4px;
  border-bottom: 1px solid #334155;
  justify-content: center;
  gap: 10px;
}
body.modo-doble-activo .control-pantallas {
  display: flex;
}
.btn-target {
  background: #1e293b;
  color: #94a3b8;
  border: 1px solid #475569;
  padding: 2px 12px;
  font-size: 0.8rem;
  cursor: pointer;
  border-radius: 3px;
}
