    <!-- FUENTE OSWALD CON CARGA DE GROSORES FINOS (400 Y 500) -->
    <link href="https://googleapis.com" rel="stylesheet">

    <style>
        /* RESET AMBIENTAL */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            /* Forzamos la fuente Oswald estilizada en toda la armadura */
            font-family: 'Oswald', 'Arial Narrow', sans-serif; 
        }

        body {
            background: #0b0f19;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding-top: 5px;
        }

        /* CONTENEDOR TOTAL DE 970PX DE ANCHO */
        .plataforma-tnt {
            width: 970px;
            background: linear-gradient(180deg, #2d3748 0%, #1a202c 100%);
            border: 3px solid #4a5568;
            border-radius: 8px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.9);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* BARRA SUPERIOR DE 3 FILAS COMPACTAS */
        .barra-canales {
            width: 100%;
            background: rgba(15, 23, 42, 0.95);
            border-bottom: 3px solid #2563eb;
            padding: 8px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .grid-botones-canales {
            display: grid;
            grid-template-columns: repeat(10, 1fr);
            gap: 4px;
            width: 100%;
        }

        /* DISEÑO DE BOTONES SEPARADOS, FINOS E INFORMALES */
        .btn-canal {
            background: linear-gradient(180deg, #1e293b 0%, #0f172a 100%);
            color: #ffffff;
            border: 1px solid #334155;
            padding: 4px 0;
            font-size: 0.95rem;
            font-weight: 400; /* LETRA REBAJADA A NIVEL DELGADO Y ESTILIZADO */
            text-transform: uppercase;
            letter-spacing: 1.5px; /* SEPARACIÓN ESTÉTICA ENTRE LETRAS */
            cursor: pointer;
            text-decoration: none;
            transition: all 0.15s ease-in-out;
            text-align: center;
            display: block;
        }
        .btn-canal:hover, .btn-canal.activo {
            background: linear-gradient(180deg, #2563eb 0%, #1e40af 100%);
            color: #38bdf8;
            border-color: #38bdf8;
            font-weight: 500;
            box-shadow: inset 0 0 6px rgba(56, 189, 248, 0.4);
        }

        /* EL BOTÓN DE DOBLE PANTALLA FINO AL FINAL */
        .btn-doble {
            width: 100%;
            background: linear-gradient(90deg, #1e3a8a 0%, #2563eb 50%, #1e3a8a 100%);
            color: white;
            border: 1px solid #3b82f6;
            padding: 5px 0;
            cursor: pointer;
            font-weight: 500; /* TEXTO REBAJADA PARA EVITAR EL EFECTO GRUESO */
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 2px; /* Mayor separación elegante */
            transition: all 0.2s;
            text-shadow: 0 1px 2px rgba(0,0,0,0.5);
        }
        .btn-doble:hover {
            background: linear-gradient(90deg, #991b1b 0%, #dc2626 50%, #991b1b 100%);
            border-color: #f87171;
            box-shadow: 0 0 12px rgba(239, 68, 68, 0.4);
        }

        /* ESPACIO DE TRABAJO GEOMÉTRICO (310px + 660px) */
        .workspace {
            display: grid;
            grid-template-columns: 310px 660px;
            width: 100%;
            height: 464px;
            background: #111827;
        }

        .panel-bloque {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        #panel-chat {
            border-right: 2px solid #4a5568;
            background: #0b0f19;
        }

        .zona-contenido {
            width: 100%;
            height: 100%;
            background: #000000;
        }

        .iframe-player {
            width: 660px;
            height: 464px;
            border: 0px;
            background: #000000;
        }
    </style>
