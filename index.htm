    <link href="https://googleapis.com" rel="stylesheet" type="text/css" />

    <style>
        /* RESET AMBIENTAL */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Oswald', Arial, sans-serif; /* Cambio radical de fuente en todo el sitio */
        }

        body {
            background: #0b0f19;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding-top: 5px;
        }

        /* CONTENEDOR TOTAL DE 970PX DE ANCHO */
        .plataforma-tnt {
            width: 970px;
            background: linear-gradient(180deg, #2d3748 0%, #1a202c 100%);
            border: 3px solid #4a5568;
            border-radius: 8px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.9);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* BARRA SUPERIOR SLIDER DE 30 CANALES COMPACTOS */
        .barra-canales {
            width: 100%;
            background: rgba(15, 23, 42, 0.95);
            border-bottom: 3px solid #2563eb;
            padding: 6px 10px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .fila-botones {
            display: flex;
            gap: 4px;
            overflow-x: auto; /* Permite scroll horizontal fluido si no caben en pantalla */
            padding-bottom: 4px;
            width: 100%;
        }
        
        /* Ocultar barra de scroll fea en navegadores */
        .fila-botones::-webkit-scrollbar {
            height: 4px;
        }
        .fila-botones::-webkit-scrollbar-thumb {
            background: #2563eb;
            border-radius: 10px;
        }

        /* DISEÑO DE LOS BOTONES COMPACTOS ESTILO C1, C2... */
        .btn-canal {
            background: #1e293b;
            color: #ffffff;
            border: 1px solid #334155;
            padding: 4px 10px; /* Tamaño reducido para que no se vean gigantes */
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.2s;
            display: inline-block;
            min-width: 42px;
            text-align: center;
        }
        .btn-canal:hover, .btn-canal.activo {
            background: linear-gradient(180deg, #2563eb 0%, #1e40af 100%);
            color: #ffffff;
            border-color: #38bdf8;
            box-shadow: inset 0 0 5px #38bdf8;
        }

        /* ESPACIO DE TRABAJO GEOMÉTRICO (310px + 660px) */
        .workspace {
            display: grid;
            grid-template-columns: 310px 660px;
            width: 100%;
            height: 464px;
            background: #111827;
        }

        .panel-bloque {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        #panel-chat {
            border-right: 2px solid #4a5568;
            background: #0b0f19;
        }

        .zona-contenido {
            width: 100%;
            height: 100%;
            background: #000000;
        }

        .iframe-player {
            width: 660px;
            height: 464px;
            border: 0px;
            background: #000000;
        }
    </style>
