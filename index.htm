<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plataforma Premium - TDC Wrestling</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Oswald', 'Arial Narrow', sans-serif; 
        }

        body {
            background: #0b0f19;
            overflow-x: hidden;
            overflow-y: auto;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding-top: 5px;
        }

        .plataforma-tnt {
            width: 970px;
            background: linear-gradient(180deg, #2d3748 0%, #1a202c 100%);
            border: 3px solid #4a5568;
            border-radius: 8px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.9);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* BARRA SUPERIOR DE CANALES */
        .barra-canales {
            width: 100%;
            background: rgba(15, 23, 42, 0.95);
            border-bottom: 3px solid #2563eb;
            padding: 8px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .grid-botones-canales {
            display: grid;
            grid-template-columns: repeat(10, 1fr);
            gap: 4px;
            width: 100%;
        }

        .btn-canal {
            background: linear-gradient(180deg, #1e293b 0%, #0f172a 100%);
            color: #ffffff;
            border: 1px solid #334155;
            padding: 4px 0;
            font-size: 0.9rem;
            cursor: pointer;
            text-align: center;
            transition: all 0.15s ease-in-out;
        }
        .btn-canal:hover, .btn-canal.activo {
            background: linear-gradient(180deg, #2563eb 0%, #1e40af 100%);
            color: #38bdf8;
            border-color: #38bdf8;
        }

        .btn-doble {
            width: 100%;
            background: linear-gradient(90deg, #1e3a8a 0%, #2563eb 50%, #1e3a8a 100%);
            color: white;
            border: 1px solid #3b82f6;
            padding: 5px 0;
            cursor: pointer;
            font-weight: 500; 
            font-size: 0.85rem;
            text-transform: uppercase;
        }
        .btn-doble:hover {
            background: linear-gradient(90deg, #991b1b 0%, #dc2626 50%, #991b1b 100%);
            border-color: #f87171;
            box-shadow: 0 0 12px rgba(239, 68, 68, 0.4);
        }

        /* WORKSPACE Y MODO DOBLE PANTALLA */
        .workspace {
            display: grid;
            grid-template-columns: 310px 660px;
            width: 100%;
            height: 464px;
            background: #111827;
            transition: all 0.3s ease;
        }

        #panel-chat {
            border-right: 2px solid #4a5568;
            background: #0b0f19;
            height: 100%;
        }

        .zona-contenido {
            width: 100%;
            height: 100%;
            background: #000000;
            display: grid;
            grid-template-columns: 1fr; /* Por defecto 1 solo reproductor */
            gap: 2px;
        }

        .iframe-player {
            width: 100%;
            height: 100%;
            border: 0;
            background: #000000;
        }

        /* SEGUNDA PANTALLA (Oculta por defecto) */
        #reproductor2 {
            display: none;
            border-left: 2px solid #2563eb;
        }

        /* --- CUANDO SE ACTIVA EL MODO DOBLE PANTALLA --- */
        body.modo-doble-activo .workspace {
            grid-template-columns: 0px 1fr; /* Oculta el chat */
        }
        body.modo-doble-activo #panel-chat {
            display: none;
        }
        body.modo-doble-activo .zona-contenido {
            grid-template-columns: 1fr 1fr; /* Divide el espacio en 2 pantallas de igual tamaño */
        }
        body.modo-doble-activo #reproductor2 {
            display: block; /* Muestra el segundo reproductor */
        }

        /* OPTIMIZACIÓN RESPONSIVA PARA MOVILES */
        @media (max-width: 980px) {
            body { padding: 0; }
            .plataforma-tnt { width: 100vw; border: none; border-radius: 0; }
            .grid-botones-canales { grid-template-columns: repeat(5, 1fr); }
            .btn-canal { font-size: 0.8rem; padding: 6px 0; }
            .workspace { display: flex; flex-direction: column; height: auto; }
            .zona-contenido { width: 100vw; height: 56.25vw; }
            body.modo-doble-activo .zona-contenido { flex-direction: column; height: auto; }
            body.modo-doble-activo .iframe-player { height: 56.25vw; }
            #panel-chat { width: 100vw; height: 350px; border-right: none; border-top: 2px solid #4a5568; }
        }
    </style>

    <script>
        // Control de qué pantalla recibe la señal cuando das clic a un canal
        let pantallaObjetivo = 'reproductor1';

        function cargarCanal(url, elemento) {
            // Carga la señal en la pantalla que esté seleccionada
            document.getElementById(pantallaObjetivo).src = url;

            let botones = document.querySelectorAll('.btn-canal');
            botones.forEach(btn => btn.classList.remove('activo'));
            elemento.classList.add('activo');
        }

        function alternarDoblePantalla() {
            document.body.classList.toggle('modo-doble-activo');
            
            // Si activa doble pantalla y el reproductor 2 no tiene nada cargado, le ponemos la agenda
            let rep2 = document.getElementById('reproductor2');
            if (document.body.classList.contains('modo-doble-activo') && rep2.src.includes('about:blank')) {
                rep2.src = 'agenda.htm';
            }
        }

        // Función opcional para alternar a qué pantalla enviar la señal (Pantalla Izq o Der)
        function cambiarObjetivoPantalla(pantalla) {
            pantallaObjetivo = pantalla;
        }
    </script>
</head>
<body>

    <div class="plataforma-tnt">
        <nav class="barra-canales">
            <!-- FILA 1: AGENDA Y CANALES 1 A 9 -->
            <div class="grid-botones-canales">
                <button class="btn-canal activo" style="color: #38bdf8; font-weight: 600;" onclick="cargarCanal('agenda.htm', this)">AGENDA</button>                               
                <button class="btn-canal" onclick="cargarCanal('https://transmision.activo.mx/h3-senal-1', this)">C1</button>                               
                <button class="btn-canal" onclick="cargarCanal('https://transmision.activo.mx/h4-senal-2', this)">C2</button>                               
                <button class="btn-canal" onclick="cargarCanal('https://transmision.activo.mx/h5-senal-3', this)">C3</button>                               
                <button class="btn-canal" onclick="cargarCanal('https://transmision.activo.mx/h6-senal-4', this)">C4</button>                               
                <button class="btn-canal" onclick="cargarCanal('https://transmision.activo.mx/h7-senal-5, this)">C5</button>                               
                <button class="btn-canal" onclick="cargarCanal('https://transmision.activo.mx/h8-senal-6', this)">C6</button>                               
                <button class="btn-canal" onclick="cargarCanal('https://transmision.activo.mx/h9-senal-7', this)">C7</button>                               
                <button class="btn-canal" onclick="cargarCanal('https://transmision.activo.mx/h10-senal-8', this)">C8</button>                               
                <button class="btn-canal" onclick="cargarCanal('https://transmision.activo.mx/h2-senal-9', this)">C9</button>
            </div>

            <!-- FILA 2: CANALES 10 A 19 -->
            <div class="grid-botones-canales">
                <button class="btn-canal" onclick="cargarCanal('https://transmision.activo.mx/h11-senal-10', this)">C10</button>                               
                <button class="btn-canal" onclick="cargarCanal('https://transmision.activo.mx/h13-senal-11', this)">C11</button>                               
                <button class="btn-canal" onclick="cargarCanal('https://transmision.activo.mx/h15-senal-12', this)">C12</button>                               
                <button class="btn-canal" onclick="cargarCanal('https://transmision.activo.mx/h17-senal-13', this)">C13</button>                               
                <button class="btn-canal" onclick="cargarCanal('https://transmision.activo.mx/h1-senal-14', this)">C14</button>                               
                <button class="btn-canal" onclick="cargarCanal('https://transmision.activo.mx/h12-senal-15', this)">C15</button>                               
                <button class="btn-canal" onclick="cargarCanal('https://transmision.activo.mx/h26-senal-16', this)">C16</button>                               
                <button class="btn-canal" onclick="cargarCanal('https://transmision.activo.mx/h27-senal-17', this)">C17</button>                               
                <button class="btn-canal" onclick="cargarCanal('https://transmision.activo.mx/h28-senal-18', this)">C18</button>                               
                <button class="btn-canal" onclick="cargarCanal('https://transmision.activo.mx/h29-senal-19', this)">C19</button>
            </div>

            <!-- FILA 3: CANALES 20 A 29 -->
            <div class="grid-botones-canales">
                <button class="btn-canal" onclick="cargarCanal('https://activo.mx', this)">C20</button>                               
                <button class="btn-canal" onclick="cargarCanal('https://activo.mx', this)">C21</button>                               
                <button class="btn-canal" onclick="cargarCanal('https://activo.mx', this)">C22</button>                               
                <button class="btn-canal" onclick="cargarCanal('https://activo.mx', this)">C23</button>                               
                <button class="btn-canal" onclick="cargarCanal('https://activo.mx', this)">C24</button>                               
                <button class="btn-canal" onclick="cargarCanal('https://activo.mx', this)">C25</button>                               
                <button class="btn-canal" onclick="cargarCanal('https://activo.mx', this)">C26</button>                               
                <button class="btn-canal" onclick="cargarCanal('https://activo.mx', this)">C27</button>                               
                <button class="btn-canal" onclick="cargarCanal('https://activo.mx', this)">C28</button>                               
                <button class="btn-canal" onclick="cargarCanal('https://activo.mx', this)">C29</button>
            </div>

            <!-- FILA 4: CANAL 30 Y BOTÓN DE INTERFAZ MUTANTE DOBLE PANTALLA -->
            <div class="grid-botones-canales" style="grid-template-columns: 1fr 9fr;">
                <button class="btn-canal" onclick="cargarCanal('https://activo.mx', this)">C30</button>
                <button class="btn-doble" onclick="alternarDoblePantalla()">🖥️ ACTIVAR INTERFAZ MUTANTE DOBLE PANTALLA (2 SEÑALES EN VIVO)</button>
            </div>
        </nav>

        <main class="workspace">
            <!-- PANEL CHAT IZQUIERDO -->
            <div id="panel-chat">
                <iframe id="chat-frame" src="https://transmision.activo.mx/h22-chatango" class="iframe-player" scrolling="no" style="overflow: hidden;" allowfullscreen></iframe>
            </div>

            <!-- ZONA DE REPRODUCCIÓN (SE DIVIDE EN 2 EN MODO MUTANTE) -->
            <div class="zona-contenido">
                <!-- PANTALLA 1 (IZQUIERDA / PRINCIPAL) -->
                <iframe id="reproductor1" src="agenda.htm" class="iframe-player" allowfullscreen></iframe>
                
                <!-- PANTALLA 2 (DERECHA / SECUNDARIA) -->
                <iframe id="reproductor2" src="about:blank" class="iframe-player" allowfullscreen></iframe>
            </div>
        </main>
    </div>

</body>
</html>
