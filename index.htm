<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plataforma TDC Wrestling</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Oswald', 'Arial Narrow', sans-serif; 
        }

        body {
            background: #0b0f19;
            overflow-x: hidden;
            overflow-y: auto;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding-top: 5px;
        }

        .plataforma-tnt {
            width: 970px;
            background: linear-gradient(180deg, #2d3748 0%, #1a202c 100%);
            border: 3px solid #4a5568;
            border-radius: 8px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.9);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* BARRA SUPERIOR DE CANALES */
        .barra-canales {
            width: 100%;
            background: rgba(15, 23, 42, 0.95);
            border-bottom: 3px solid #2563eb;
            padding: 8px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .grid-botones-canales {
            display: grid;
            grid-template-columns: repeat(10, 1fr);
            gap: 4px;
            width: 100%;
        }

        .btn-canal {
            background: linear-gradient(180deg, #1e293b 0%, #0f172a 100%);
            color: #ffffff;
            border: 1px solid #334155;
            padding: 5px 0;
            font-size: 0.9rem;
            font-weight: 500; 
            text-transform: uppercase;
            letter-spacing: 1px; 
            cursor: pointer;
            text-align: center;
            transition: all 0.15s ease-in-out;
        }

        .btn-canal:hover, .btn-canal.activo {
            background: linear-gradient(180deg, #2563eb 0%, #1e40af 100%);
            color: #38bdf8;
            border-color: #38bdf8;
            box-shadow: inset 0 0 6px rgba(56, 189, 248, 0.4);
        }

        .btn-agenda {
            color: #38bdf8;
            border-color: #2563eb;
            font-weight: 600;
        }

        .btn-doble {
            width: 100%;
            background: linear-gradient(90deg, #1e3a8a 0%, #2563eb 50%, #1e3a8a 100%);
            color: white;
            border: 1px solid #3b82f6;
            padding: 5px 0;
            cursor: pointer;
            font-weight: 500; 
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 2px; 
            transition: all 0.2s;
        }

        .btn-doble:hover {
            background: linear-gradient(90deg, #991b1b 0%, #dc2626 50%, #991b1b 100%);
            border-color: #f87171;
            box-shadow: 0 0 12px rgba(239, 68, 68, 0.4);
        }

        /* ESPACIO DE TRABAJO EN GRID */
        .workspace {
            display: grid;
            grid-template-columns: 310px 660px;
            width: 100%;
            height: 464px;
            background: #111827;
            transition: grid-template-columns 0.3s ease;
        }

        #panel-chat {
            border-right: 2px solid #4a5568;
            background: #0b0f19;
            height: 100%;
            width: 100%;
        }

        .zona-contenido {
            width: 100%;
            height: 100%;
            background: #000000;
            position: relative;
        }

        .iframe-player {
            width: 100%;
            height: 100%;
            border: 0;
            background: #000000;
        }

        /* ACTIVAR PANTALLA COMPLETA SIN CHAT */
        body.modo-doble-activo .workspace {
            grid-template-columns: 0px 1fr;
        }
        body.modo-doble-activo #panel-chat {
            display: none;
        }

        /* RESPONSIVE PARA MÓVILES */
        @media (max-width: 980px) {
            body { padding: 0; }
            .plataforma-tnt { width: 100vw; border: none; border-radius: 0; }
            .grid-botones-canales { grid-template-columns: repeat(5, 1fr); }
            .workspace { display: flex; flex-direction: column; height: auto; }
            .zona-contenido { width: 100vw; height: 56.25vw; }
            #panel-chat { width: 100vw; height: 350px; border-right: none; border-top: 2px solid #4a5568; }
        }
    </style>
</head>
<body>

    <div class="plataforma-tnt">
        <!-- BARRA DE CANALES SUPERIOR -->
        <nav class="barra-canales">
            <div class="grid-botones-canales">
                <button class="btn-canal btn-agenda activo" onclick="cargarCanal('agenda.htm', this)">AGENDA</button>                               
                <button class="btn-canal" onclick="cargarCanal('https://ejemplo.com/embed/canal1', this)">C1</button>                               
                <button class="btn-canal" onclick="cargarCanal('https://ejemplo.com/embed/canal2', this)">C2</button>                               
                <button class="btn-canal" onclick="cargarCanal('https://ejemplo.com/embed/canal3', this)">C3</button>                               
                <button class="btn-canal" onclick="cargarCanal('https://ejemplo.com/embed/canal4', this)">C4</button>                               
                <button class="btn-canal" onclick="cargarCanal('https://ejemplo.com/embed/canal5', this)">C5</button>                               
                <button class="btn-canal" onclick="cargarCanal('https://ejemplo.com/embed/canal6', this)">C6</button>                               
                <button class="btn-canal" onclick="cargarCanal('https://ejemplo.com/embed/canal7', this)">C7</button>                               
                <button class="btn-canal" onclick="cargarCanal('https://ejemplo.com/embed/canal8', this)">C8</button>                               
                <button class="btn-canal" onclick="cargarCanal('https://ejemplo.com/embed/canal9', this)">C9</button>
            </div>

            <div class="grid-botones-canales" style="grid-template-columns: 1fr 9fr;">
                <button class="btn-canal" onclick="cargarCanal('https://ejemplo.com/embed/canal10', this)">C10</button>
                <button class="btn-doble" onclick="alternarDoblePantalla()">🖥️ ACTIVAR MODO CINE / PANTALLA COMPLETA</button>
            </div>
        </nav>

        <!-- ESPACIO DE TRABAJO -->
        <main class="workspace">
            <!-- PANEL DE CHAT IZQUIERDO -->
            <div id="panel-chat">
                <!-- AQUÍ PEGAS EL EMBED/IFRAME DE TU CHAT EXTERNO -->
                <iframe src="https://v2.chatango.com/group/TU_CHAT" width="100%" height="100%" frameborder="0"></iframe>
            </div>

            <!-- PANEL DERECHO DE REPRODUCCIÓN / AGENDA -->
            <div class="zona-contenido">
                <iframe id="reproductor" src="agenda.htm" class="iframe-player" allowfullscreen></iframe>
            </div>
        </main>
    </div>

    <script>
        // Función para cambiar de canal o volver a la agenda sin recargar la página
        function cargarCanal(url, elemento) {
            document.getElementById('reproductor').src = url;

            // Marcar botón activo
            let botones = document.querySelectorAll('.btn-canal');
            botones.forEach(btn => btn.classList.remove('activo'));
            elemento.classList.add('activo');
        }

        // Alternar el modo pantalla completa quitando el chat
        function alternarDoblePantalla() {
            document.body.classList.toggle('modo-doble-activo');
        }
    </script>
</body>
</html>
