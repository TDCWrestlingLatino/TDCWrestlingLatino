    <style>
        /* FUENTE DEPORTIVA E INFORMAL INYECTADA DE FORMA GLOBAL */
        @import url('https://googleapis.com');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0b0f19;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding-top: 5px;
        }

        /* CONTENEDOR TOTAL FIJADO A TUS 970PX DE ANCHO */
        .plataforma-tnt {
            width: 970px;
            background: linear-gradient(180deg, #2d3748 0%, #1a202c 100%);
            border: 3px solid #4a5568;
            border-radius: 8px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.9);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* BARRA SUPERIOR: PARRILLA DE 3 FILAS COMPACTAS */
        .barra-canales {
            width: 100%;
            background: rgba(15, 23, 42, 0.95);
            border-bottom: 3px solid #2563eb;
            padding: 8px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        /* LA GRILLA MAGICA: 10 botones exactos por fila */
        .grid-botones-canales {
            display: grid;
            grid-template-columns: repeat(10, 1fr);
            gap: 4px;
            width: 100%;
        }

        /* DISEÑO DE LOS BOTONES INFORMALES ESTILO C1, C2... */
        .btn-canal {
            background: linear-gradient(180deg, #1e293b 0%, #0f172a 100%);
            color: #ffffff;
            border: 1px solid #334155;
            padding: 3px 0;
            /* Forzamos combinaciones de fuentes tipográficas de acción por si falla una */
            font-family: 'Teko', 'Oswald', 'Impact', sans-serif; 
            font-size: 1.2rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.15s ease-in-out;
            text-align: center;
            display: block;
        }
        .btn-canal:hover, .btn-canal.activo {
            background: linear-gradient(180deg, #2563eb 0%, #1e40af 100%);
            color: #38bdf8;
            border-color: #38bdf8;
            box-shadow: inset 0 0 6px rgba(56, 189, 248, 0.6);
            transform: scale(1.02);
        }

        /* FILA INFERIOR DEL BOTÓN DE DOBLE PANTALLA */
        .fila-adicional {
            width: 100%;
            margin-top: 2px;
        }

        /* EL BOTÓN DE DOBLE PANTALLA DE ANCHO COMPLETO AL FINAL */
        .btn-doble {
            width: 100%;
            background: linear-gradient(90deg, #1e3a8a 0%, #3b82f6 50%, #1e3a8a 100%);
            color: white;
            border: 1px solid #3b82f6;
            padding: 5px 0;
            cursor: pointer;
            font-family: 'Oswald', 'Impact', sans-serif;
            font-weight: 700;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.2s;
            text-shadow: 0 1px 3px rgba(0,0,0,0.8);
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.2);
        }
        .btn-doble:hover {
            background: linear-gradient(90deg, #b91c1c 0%, #ef4444 50%, #b91c1c 100%);
            border-color: #f87171;
            box-shadow: 0 0 12px rgba(239, 68, 68, 0.6);
        }

        /* ESPACIO DE TRABAJO GEOMÉTRICO (310px + 660px) */
        .workspace {
            display: grid;
            grid-template-columns: 310px 660px;
            width: 100%;
            height: 464px;
            background: #111827;
        }

        .panel-bloque {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        #panel-chat {
            border-right: 2px solid #4a5568;
            background: #0b0f19;
        }

        .zona-contenido {
            width: 100%;
            height: 100%;
            background: #000000;
        }

        .iframe-player {
            width: 660px;
            height: 464px;
            border: 0px;
            background: #000000;
        }
    </style>
