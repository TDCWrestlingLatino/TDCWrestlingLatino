<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Plataforma Premium - TDC Wrestling</title>
    
    <!-- FUENTE OSWALD DE TU CÓDIGO VIEJO -->
    <link href="https://googleapis.com" rel="stylesheet" type="text/css" />

    <style>
        /* RESET AMBIENTAL */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0b0f19; /* Fondo oscuro base */
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding-top: 5px;
        }

        /* CONTENEDOR TOTAL FIJADO A TUS 970PX DE ANCHO */
        .plataforma-tnt {
            width: 970px;
            background: linear-gradient(180deg, #2d3748 0%, #1a202c 100%);
            border: 3px solid #4a5568;
            border-radius: 8px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.9);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* BARRA SUPERIOR DE CANALES ESTILO OSWALD METÁLICO */
        .barra-canales {
            width: 100%;
            background: rgba(15, 23, 42, 0.95);
            border-bottom: 3px solid #2563eb;
            padding: 6px 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .fila-botones {
            display: flex;
            gap: 4px;
        }

        /* DISEÑO BOTONERA DE CANALES PREMIUM */
        .btn-canal {
            background: #1e293b;
            color: #ffffff;
            border: 1px solid #334155;
            padding: 6px 12px;
            font-family: 'Oswald', Arial, sans-serif;
            font-size: 12px;
            text-transform: uppercase;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.2s;
            display: inline-block;
        }
        .btn-canal:hover {
            background: linear-gradient(180deg, #2563eb 0%, #1e40af 100%);
            color: #ffffff;
            border-color: #38bdf8;
            box-shadow: inset 0 0 6px #38bdf8;
        }

        /* ESPACIO DE TRABAJO GEOMÉTRICO (310px + 660px = 970px) */
        .workspace {
            display: grid;
            grid-template-columns: 310px 660px; /* TUS MEDIDAS EXACTAS */
            width: 100%;
            height: 464px; /* TU ALTURA EXACTA */
            background: #111827;
        }

        .panel-bloque {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        #panel-chat {
            border-right: 2px solid #4a5568;
            background: #0b0f19;
        }

        .zona-contenido {
            width: 100%;
            height: 100%;
            background: #000000;
        }

        /* REPRODUCTOR INDEPENDIENTE TOTAL */
        .iframe-player {
            width: 660px;  /* TU MEDIDA REAL */
            height: 464px; /* TU MEDIDA REAL */
            border: 0px;
            background: #000000;
        }
    </style>

    <!-- TUS SCRIPTS ORIGINALES DE PROTECCIÓN ANTICUÑA REALES -->
    <script type="text/javascript">
        document.oncontextmenu = function(){return false}
    </script> 
    <script type="text/javascript">
        // Simulación manual del bind sin depender de librerías externas pesadas
        document.addEventListener("contextmenu", function(e){
            e.preventDefault();
        }, false);
    </script>  
    <script language="JavaScript">
        function KeyPress() {
            alert('inhabilitado');
            return false;
        }
        document.onkeydown = KeyPress;
    </script>
</head>
<body>

    <div class="plataforma-tnt">
        
        <!-- BARRA SUPERIOR CON TU SISTEMA DE TARGET NATIVO "HOME" -->
        <nav class="barra-canales">
            <div class="fila-botones">
                <!-- Tu enlace original de la Agenda -->
                <a href="https://transmision.activo.mx/h23-plataforma" target="home" class="btn-canal">Agenda TV</a>                               
                <!-- Tus señales reales apuntando directamente a tu reproductor -->
                <a href="https://dlive.sx/stream/stream-930.php" target="home" class="btn-canal">CANAL 1 (DLIVE)</a>                               
                <a href="https://transmision.activo.mx/h3-senal-1.htm" target="home" class="btn-canal">CANAL 2</a>                               
                <a href="https://transmision.activo.mx/h4-senal-2" target="home" class="btn-canal">CANAL 3</a>                               
                <a href="https://transmision.activo.mx/h5-senal-3" target="home" class="btn-canal">CANAL 4</a>                               
            </div>
        </nav>

        <!-- ESPACIO DE TRABAJO CON LAS DIMENSIONES EXACTAS DE TU BLOGGER -->
        <main class="workspace">
            
            <!-- CHAT FLOTANTE IZQUIERDO (310px x 464px) -->
            <div class="panel-bloque" id="panel-chat">
                <!-- Chatango oficial directo -->
                <iframe src="https://chatango.com" width="100%" height="100%" frameborder="0" allowtransparency="true"></iframe>
            </div>

            <!-- CAJA DE TRANSMISIONES DE ANCHO COMPLETO (660px x 464px) -->
            <div class="panel-bloque zona-contenido">
                <!-- EL MARCO DE VIDEO INDEPENDIENTE CON EL NOMBRE "HOME" QUE TUS BOTONES REFIEREN -->
                <!-- Inicia cargando tu señal en vivo tal cual como lo tenías configurado -->
                <iframe allowfullscreen="" name="home" class="iframe-player" src="https://dlive.sx/stream/stream-930.php"></iframe>
            </div>

        </main>
    </div>

</body>
</html>
